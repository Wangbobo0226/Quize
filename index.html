<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海巡法規與勤務線上測驗系統</title>
<style>
:root {
--primary-color: #062f54;
--secondary-color: #0a659c;
--accent-color: #d5a928;
--wrong-color: #dc3545;
--success-color: #168a66;
--bg-color: #e8f0f5;
--card-bg: #ffffff;
}

* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
background: linear-gradient(145deg, #dcebf3 0%, #f7fafc 55%, #dce8ef 100%);
color: #333;
margin: 0;
padding: 12px;
display: flex;
justify-content: center;
min-height: 100vh;
overflow-x: hidden;
}

.container {
width: 100%;
max-width: 800px;
background: var(--card-bg);
padding: 20px 16px;
border-radius: 12px;
box-shadow: 0 18px 45px rgba(6, 47, 84, 0.14), 0 4px 15px rgba(0, 0, 0, 0.06);
animation: pageEnter .55s ease both;
}

.brand-header {
background: linear-gradient(135deg, #062f54, #0b6c9f);
color: #fff;
margin: -20px -16px 20px;
padding: 24px 20px 22px;
border-radius: 12px 12px 0 0;
position: relative;
overflow: hidden;
box-shadow: inset 0 -1px rgba(255,255,255,.18);
}

.brand-header::before {
content: "";
position: absolute;
width: 220px;
height: 220px;
right: -80px;
top: -130px;
border: 1px solid rgba(255,255,255,.18);
border-radius: 50%;
box-shadow: 0 0 0 18px rgba(255,255,255,.04), 0 0 0 36px rgba(255,255,255,.03);
}

.brand-header::after {
content: "⚓ 〰 〰 〰";
position: absolute;
right: 14px;
bottom: 8px;
font-size: 1.4rem;
letter-spacing: 5px;
color: rgba(255,255,255,.22);
}

.brand-header h1 {
color: #fff;
text-align: left;
margin: 0;
}

.brand-subtitle {
margin-top: 7px;
font-size: .88rem;
letter-spacing: 1px;
color: #d9eef8;
}

.section-label {
font-weight: 700;
color: var(--primary-color);
margin: 0 0 7px;
font-size: .95rem;
}

.start-btn {
background: linear-gradient(135deg, #d5a928, #b88910);
color: #fff;
font-size: 1.08rem;
font-weight: 700;
letter-spacing: 1px;
box-shadow: 0 3px 8px rgba(126, 93, 0, .25);
}

h1 {
text-align: center;
color: var(--primary-color);
margin: 0 0 20px 0;
font-size: 1.5rem;
line-height: 1.3;
}

.control-panel {
display: flex;
gap: 10px;
margin-bottom: 16px;
flex-direction: column;
}

.bank-category {
display: flex;
flex-direction: column;
gap: 6px;
padding: 10px;
border: 1px solid #d5e2eb;
border-radius: 8px;
background: #fff;
}

.bank-category-header {
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
color: var(--primary-color);
}

.category-select-btn {
width: auto;
padding: 6px 9px;
font-size: .78rem;
background: #5c7280;
}

.bank-category-options {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 2px 8px;
}

.bank-picker {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 8px;
padding: 10px;
border: 1px solid #dee2e6;
border-radius: 8px;
background: #f8f9fa;
}

.bank-option {
display: flex;
align-items: center;
gap: 8px;
padding: 8px;
font-size: 0.92rem;
cursor: pointer;
}

.bank-option input {
width: auto;
accent-color: var(--secondary-color);
}

.selection-actions {
display: flex;
gap: 8px;
flex-wrap: wrap;
}

.selection-actions button {
font-size: 0.9rem;
padding: 9px 12px;
width: auto;
flex: 1 1 150px;
}

@media (min-width: 480px) {
.control-panel {
flex-direction: column;
}
}

select, button {
padding: 12px 15px;
font-size: 1rem;
border-radius: 8px;
border: 1px solid #ccc;
outline: none;
width: 100%;
}

select {
background-color: #fff;
appearance: none;
-webkit-appearance: none;
background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB6%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
background-repeat: no-repeat;
background-position: right 12px top 50%;
background-size: 12px auto;
padding-right: 30px;
}

button {
background-color: var(--secondary-color);
color: white;
border: none;
cursor: pointer;
font-weight: 500;
transition: background-color 0.2s, opacity 0.2s, transform 0.2s, box-shadow 0.2s;
touch-action: manipulation;
}

button:hover:not(:disabled) {
transform: translateY(-2px);
box-shadow: 0 7px 14px rgba(6, 47, 84, .14);
}

button:active {
opacity: 0.8;
}

button:disabled {
background-color: #ccc !important;
cursor: not-allowed;
opacity: 0.6;
}

.stats-card {
background: linear-gradient(135deg, #f0f7fb, #e5eef4);
padding: 12px 16px;
border-radius: 8px;
margin-bottom: 16px;
display: flex;
flex-direction: column;
gap: 9px;
font-weight: bold;
font-size: 0.95rem;
border: 1px solid #d5e2eb;
box-shadow: 0 4px 12px rgba(6, 47, 84, .06);
}

.stats-main {
display: flex;
justify-content: space-between;
gap: 12px;
}

.progress-track {
height: 8px;
background: #d4e2ea;
border-radius: 999px;
overflow: hidden;
}

.progress-bar {
height: 100%;
width: 0%;
border-radius: inherit;
background: linear-gradient(90deg, var(--secondary-color), var(--accent-color));
transition: width .5s cubic-bezier(.22, 1, .36, 1);
}

.question-card {
border: 1px solid #dbe5eb;
border-radius: 12px;
padding: 16px;
margin-bottom: 16px;
background-color: #fff;
box-shadow: 0 7px 18px rgba(6, 47, 84, .06);
}

#quizArea > .question-card {
will-change: transform, opacity;
}

.question-enter {
animation: questionEnter .38s cubic-bezier(.22, 1, .36, 1) both;
}

.question-title {
font-size: 1.05rem;
font-weight: bold;
margin-bottom: 16px;
color: #1a1a1a;
line-height: 1.5;
letter-spacing: .01em;
}

.options-container {
display: flex;
flex-direction: column;
gap: 10px;
}

.option-btn {
text-align: left;
background: linear-gradient(135deg, #ffffff, #f5f8fa);
color: #333;
border: 1px solid #ced4da;
padding: 14px 15px;
border-radius: 8px;
cursor: pointer;
font-size: 0.95rem;
line-height: 1.4;
white-space: normal;
word-break: break-word;
transition: transform .2s, box-shadow .2s, border-color .2s, background .2s;
animation: optionEnter .35s ease both;
}

.option-btn:nth-child(2) { animation-delay: .035s; }
.option-btn:nth-child(3) { animation-delay: .07s; }
.option-btn:nth-child(4) { animation-delay: .105s; }
.option-btn:hover:not(:disabled) {
border-color: var(--secondary-color);
background: #eef8fc;
transform: translateX(4px);
box-shadow: 0 5px 12px rgba(10, 101, 156, .12);
}

.option-btn.correct {
background: linear-gradient(135deg, #dff7e9, #c8eedb) !important;
border-color: #c3e6cb !important;
color: #155724 !important;
font-weight: bold;
animation: correctPop .42s cubic-bezier(.22, 1, .36, 1) both;
}

.option-btn.wrong {
background: linear-gradient(135deg, #ffe5e8, #f8d7da) !important;
border-color: #f5c6cb !important;
color: #721c24 !important;
animation: wrongFlash .42s ease both;
}

.result-feedback {
margin-top: 15px;
padding: 12px;
border-radius: 6px;
font-weight: bold;
font-size: 0.95rem;
display: none;
line-height: 1.4;
animation: feedbackEnter .35s ease both;
}

.result-feedback.correct {
background-color: #d4edda;
color: #155724;
}

.result-feedback.wrong {
background-color: #f8d7da;
color: #721c24;
}

.custom-answer-actions {
display: flex;
gap: 8px;
flex-wrap: wrap;
margin-top: 10px;
padding-top: 10px;
border-top: 1px solid rgba(22, 138, 102, .18);
}

.custom-answer-actions button {
width: auto;
flex: 1 1 180px;
padding: 9px 12px;
font-size: .9rem;
}

.custom-answer-actions .remove-answer-btn {
background: #168a66;
}

.custom-answer-actions .keep-answer-btn {
background: #5c7280;
}

/* 錯題庫提示改為不佔版面的隱藏容器，避免管理區下方出現空白紅色區域 */
#customSetNotice,
#customResultNotice {
display: none !important;
}

.result-feedback.correct {
border-left: 4px solid var(--success-color);
}

#resultArea.result-enter {
animation: resultEnter .55s cubic-bezier(.22, 1, .36, 1) both;
}

#celebrationLayer {
position: fixed;
inset: 0;
pointer-events: none;
overflow: hidden;
z-index: 20;
}

.confetti {
position: absolute;
top: -18px;
width: 9px;
height: 15px;
border-radius: 2px;
animation: confettiFall 1.25s cubic-bezier(.2, .7, .3, 1) forwards;
}

#toast {
position: fixed;
left: 50%;
bottom: 24px;
transform: translate(-50%, 18px);
opacity: 0;
z-index: 30;
padding: 10px 16px;
border-radius: 999px;
background: rgba(6, 47, 84, .94);
color: #fff;
font-size: .92rem;
font-weight: 700;
box-shadow: 0 8px 24px rgba(6, 47, 84, .24);
pointer-events: none;
}

#toast.toast-show {
animation: toastInOut 1.55s ease both;
}

.answer-shake {
animation: answerShake .42s ease both;
}

@keyframes pageEnter {
from { opacity: 0; transform: translateY(12px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes questionEnter {
from { opacity: 0; transform: translateY(12px) scale(.985); }
to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes optionEnter {
from { opacity: 0; transform: translateX(-8px); }
to { opacity: 1; transform: translateX(0); }
}

@keyframes correctPop {
0% { transform: scale(.98); }
55% { transform: scale(1.025); }
100% { transform: scale(1); }
}

@keyframes wrongFlash {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-5px); }
75% { transform: translateX(5px); }
}

@keyframes answerShake {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-6px); }
50% { transform: translateX(6px); }
75% { transform: translateX(-3px); }
}

@keyframes feedbackEnter {
from { opacity: 0; transform: translateY(7px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes resultEnter {
from { opacity: 0; transform: translateY(18px) scale(.98); }
to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes confettiFall {
0% { opacity: 1; transform: translate3d(0, 0, 0) rotate(0deg); }
100% { opacity: 0; transform: translate3d(var(--drift), 92vh, 0) rotate(720deg); }
}

@keyframes toastInOut {
0% { opacity: 0; transform: translate(-50%, 18px); }
15%, 78% { opacity: 1; transform: translate(-50%, 0); }
100% { opacity: 0; transform: translate(-50%, 8px); }
}

@media (prefers-reduced-motion: reduce) {
*, *::before, *::after {
animation-duration: .01ms !important;
animation-iteration-count: 1 !important;
scroll-behavior: auto !important;
transition-duration: .01ms !important;
}
}

.bank-menu-toggle {
background: linear-gradient(135deg, #0a659c, #062f54);
font-weight: 700;
display: flex;
align-items: center;
justify-content: center;
gap: 9px;
margin-bottom: 10px;
}
.hamburger-icon {
display: inline-flex;
flex-direction: column;
gap: 4px;
width: 20px;
}
.hamburger-icon span {
display: block;
height: 2px;
width: 20px;
background: #fff;
border-radius: 2px;
}
.bank-picker-menu {
display: none;
padding: 10px;
border: 1px solid #c9dce8;
border-radius: 10px;
background: linear-gradient(180deg, #f7fbfd, #eef5f8);
animation: questionEnter .25s ease both;
}
.bank-picker-menu.open { display: block; }
.bank-menu-hint {
margin: 0 0 8px;
font-size: .86rem;
color: #526b79;
}
.drone-random-controls {
display: none;
margin: 10px 0 0;
padding: 12px;
border: 1px solid #e2c86b;
border-radius: 9px;
background: #fffaf0;
}
.drone-random-controls.visible { display: block; }
.drone-random-row {
display: flex;
align-items: center;
gap: 10px;
flex-wrap: wrap;
}
.drone-random-row label { font-weight: 700; color: var(--primary-color); }
.drone-random-row input {
width: 92px;
padding: 10px;
border: 1px solid #c8b878;
border-radius: 7px;
font-size: 1rem;
}
.drone-random-note { margin-top: 6px; font-size: .82rem; color: #6c5a25; }

.nav-actions {
display: flex;
gap: 10px;
}

.nav-actions button {
flex: 1;
}

/* 行動版一般網站介面優化 */
:root {
  --primary-color: #083b63;
  --secondary-color: #0b6f9f;
  --accent-color: #d6a719;
  --soft-blue: #eef6fa;
  --line-blue: #d7e5ed;
}
body {
  padding: 0;
  background: #eef3f6;
}
.container {
  max-width: 920px;
  min-height: 100vh;
  padding: 0 24px 36px;
  border-radius: 0;
  box-shadow: 0 0 28px rgba(6, 47, 84, .08);
}
.brand-header {
  margin: 0 -24px 28px;
  padding: 42px 32px 34px;
  border-radius: 0 0 18px 18px;
  background: linear-gradient(135deg, #06345b 0%, #0879a9 100%);
}
.brand-header h1 {
  font-size: clamp(1.55rem, 4vw, 2.2rem);
  letter-spacing: .03em;
}
.brand-subtitle {
  max-width: 620px;
  line-height: 1.6;
  font-size: .95rem;
}
.control-panel {
  gap: 14px;
}
.section-label {
  margin: 4px 0 0;
  font-size: 1.25rem;
  letter-spacing: .02em;
}
.bank-menu-toggle {
  position: relative;
  min-height: 58px;
  margin: 0;
  border-radius: 12px;
  font-size: 1.05rem;
  box-shadow: 0 5px 14px rgba(6, 47, 84, .16);
}
.bank-menu-toggle[aria-expanded="true"] {
  border-radius: 12px 12px 0 0;
  margin-bottom: -14px;
}
.hamburger-icon {
  flex: 0 0 24px;
  width: 24px;
  gap: 5px;
}
.hamburger-icon span { width: 24px; height: 3px; }
.bank-picker-menu {
  padding: 16px;
  border: 1px solid var(--line-blue);
  border-radius: 0 0 12px 12px;
  background: #f8fbfc;
  box-shadow: 0 8px 20px rgba(6, 47, 84, .1);
}
.bank-menu-hint {
  margin: 0 0 14px;
  line-height: 1.55;
}
.bank-picker {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 0;
  border: 0;
  background: transparent;
}
.bank-category {
  gap: 10px;
  padding: 14px;
  border: 1px solid var(--line-blue);
  border-radius: 10px;
  background: #fff;
}
.bank-category-header {
  align-items: flex-start;
  line-height: 1.45;
}
.bank-category-header strong { flex: 1; }
.category-select-btn {
  flex: 0 0 auto;
  width: auto;
  padding: 7px 10px;
  font-size: .82rem;
  white-space: nowrap;
}
.bank-category-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
  gap: 4px 8px;
}
.bank-option {
  min-height: 42px;
  padding: 9px 8px;
  border-radius: 7px;
  line-height: 1.35;
}
.bank-option:hover { background: var(--soft-blue); }
.bank-option input { flex: 0 0 auto; width: 18px; height: 18px; }
.selection-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 2px;
}
.selection-actions button {
  min-height: 48px;
  padding: 10px 12px;
  font-size: .93rem;
}
.selection-actions button:last-child { grid-column: 1 / -1; }
.control-panel > button:not(.bank-menu-toggle):not(.start-btn) {
  min-height: 52px;
}
.start-btn {
  min-height: 58px;
  font-size: 1.12rem;
  border-radius: 12px;
}
.drone-random-controls {
  margin: 0;
  border-radius: 10px;
}
.drone-random-row { justify-content: space-between; }
.drone-random-row input { width: 88px; text-align: center; }
.question-card { border-radius: 12px; }

@media (max-width: 560px) {
  .container { padding: 0 16px 28px; }
  .brand-header { margin: 0 -16px 22px; padding: 32px 22px 28px; }
  .brand-header h1 { line-height: 1.35; }
  .brand-subtitle { font-size: .86rem; }
  .bank-picker-menu { padding: 12px; }
  .bank-category { padding: 12px; }
  .bank-category-header { flex-direction: column; }
  .category-select-btn { align-self: flex-start; }
  .bank-category-options { display: flex; flex-direction: column; gap: 2px; }
  .selection-actions { gap: 8px; }
  .selection-actions button { font-size: .88rem; }
}


/* 簡潔介面與深色模式 */
.brand-topline { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.brand-mark { font-size:1.35rem; color:rgba(255,255,255,.86); }
.theme-toggle { width:auto; min-height:38px; padding:8px 12px; border:1px solid rgba(255,255,255,.32); border-radius:999px; background:rgba(0,0,0,.16); color:#fff; font-size:.82rem; }
.theme-toggle:hover:not(:disabled) { transform:none; box-shadow:none; background:rgba(0,0,0,.28); }
.selection-summary { padding:10px 12px; border:1px solid var(--line-blue); border-radius:8px; background:var(--soft-blue); color:var(--primary-color); font-size:.9rem; text-align:center; }
.quiz-action-panel { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.quiz-action-panel[hidden] { display:none; }
.quiz-action-panel button { min-height:50px; }
.random-btn { background:#397286; }
.start-btn { margin:0; }
.control-panel { gap:12px; }
.selection-actions { margin-top:0; }
.bank-menu-toggle { min-height:52px; }
.bank-picker-menu { margin-top:-4px; }

html[data-theme="dark"] {
  --primary-color:#d8eaf7; --secondary-color:#4ca6d5; --accent-color:#e4bb43;
  --bg-color:#101820; --card-bg:#192630; --soft-blue:#223945; --line-blue:#36515f;
}
html[data-theme="dark"] body { background:#0f171d; color:#e7eef2; }
html[data-theme="dark"] .container { background:#192630; box-shadow:0 0 28px rgba(0,0,0,.35); }
html[data-theme="dark"] .section-label, html[data-theme="dark"] h1 { color:var(--primary-color); }
html[data-theme="dark"] .bank-picker-menu { background:#1b2b35; border-color:#36515f; }
html[data-theme="dark"] .bank-category { background:#21333e; border-color:#3b5867; }
html[data-theme="dark"] .bank-category-header { color:#d8eaf7; }
html[data-theme="dark"] .bank-option { color:#e7eef2; }
html[data-theme="dark"] .bank-option:hover { background:#2a4654; }
html[data-theme="dark"] .selection-summary { background:#223945; border-color:#36515f; color:#d8eaf7; }
html[data-theme="dark"] .question-card, html[data-theme="dark"] .stats-card { background:#21333e; border-color:#3b5867; color:#e7eef2; }
html[data-theme="dark"] .question-title { color:#f3f7f9; }
html[data-theme="dark"] .option-btn { background:linear-gradient(135deg,#263b47,#1e303a); color:#e7eef2; border-color:#47616e; }
html[data-theme="dark"] .option-btn:hover:not(:disabled) { background:#294b5c; border-color:#6db8dc; }
html[data-theme="dark"] select, html[data-theme="dark"] input { background:#21333e; color:#e7eef2; border-color:#47616e; }
html[data-theme="dark"] .drone-random-controls { background:#3b3420; border-color:#8c7428; }
html[data-theme="dark"] .drone-random-note { color:#f0d878; }
html[data-theme="dark"] .custom-controls, html[data-theme="dark"] #customResultControls { color:#d8eaf7; }

@media (max-width:560px) {
  .quiz-action-panel { grid-template-columns:1fr; }
  .theme-toggle { font-size:.78rem; padding:7px 10px; }
}


/* 深色模式相容備援：同時支援 html 屬性與 body class */
body.dark-mode { background:#0f171d; color:#e7eef2; }
body.dark-mode .container { background:#192630; box-shadow:0 0 28px rgba(0,0,0,.35); }

on": "民眾依法逮捕現行犯後，該如何處理方屬合法？", "options": ["立即將現行犯移送至法院", "等待檢察官審查並簽發拘票後，將現行犯送交檢察官", "立即送交檢察官或司法警察官", "通知現行犯的家人等至法院辦理接回手續。"], "answer": [2]}, {"id": "finalLaw1_12", "type": "single", "question": "司法警察官率同數名司法警察在某KTV三樓包廂逮捕通緝犯甲，該等警員當時如欲執行附帶搜索，下列何者不在其搜索範圍內？", "options": ["甲當時所穿著外套口袋", "甲放置於桌面手拿包", "甲身旁購物袋", "甲停放於KTV店家附設停車場汽車。"], "answer": [3]}, {"id": "finalLaw1_13", "type": "single", "question": "司法警察官或司法警察，因調查犯罪的必要，使用「通知書」通知犯罪嫌疑人到場詢問；若犯罪嫌疑人經合法通知而無正當理由不到場者，其法律效果如何？", "options": ["得逕行逮捕", "得報請檢察官核發拘票", "得報請檢察官核發傳票", "無任何法律效果。"], "answer": [1]}, {"id": "finalLaw1_14", "type": "single", "question": "警員甲於詢問依現行犯逮捕到案的乙時，因一時疏忽違背刑事訴訟法第100條之3禁止夜間詢問規定而取得乙自白筆錄。依法該筆錄證據能力如何？", "options": ["由法院審酌人權保障與公共利益的均衡維護判斷之", "若其違背顯非出於惡意，且該自白或陳述係出於自由意志者，仍有證據能力", "違背刑事訴訟法第100條之3而取得的警詢筆錄，一律不得作為證據", "此筆錄屬傳聞證據，原則上無證據能力。"], "answer": [1]}, {"id": "finalLaw1_15", "type": "single", "question": "司法警察甲於執行巡邏勤務時，發現乙將機車停在某超商門口，由其後座乘客丙持刀進入強盜。下列強制處分，何者甲不得為之？", "options": ["對丙進行逮捕", "丙供述乙為其共同正犯，且因情形急迫，而對乙逕行拘提", "立即搜索丙的身體", "赴丙宅逕行搜索。"], "answer": [3]}, {"id": "finalLaw1_16", "type": "single", "question": "依據刑事訴訟法第95條訊問被告應告知事項，下列何者為非？", "options": ["犯罪嫌疑及所犯所有罪名。罪名經告知後，認為應變更者，應再告知", "得保持緘默，無須違背自己的意思而為陳述", "得選任辯護人。如為低收入戶、中低收入戶、原住民或其他依法令得請求法律扶助者，得請求之", "是否同意進行夜間訊問。"], "answer": [3]}, {"id": "finalLaw1_17", "type": "single", "question": "依據刑事訴訟法第93條之1規定，不予列計24小時內的法定障礙事由，下列何者為非？", "options": ["因交通障礙或其他不可抗力事由所生不得已的遲滯", "依100條之3規定不得為詢問者", "因被告或犯罪嫌疑人身體健康突發的事由，事實上不能訊問者", "等候辯護人到場致未予訊問者，但等候時間不得逾6小時。"], "answer": [3]}, {"id": "finalLaw1_18", "type": "single", "question": "依刑事訴訟法第131條，得逕行搜索的情況，下列何者為非？", "options": ["因逮捕被告、犯罪嫌疑人或執行拘提、羈押，有事實足認被告或犯罪嫌疑人確所在內者", "因追躡現行犯或逮捕脫逃人，有事實足認現行犯或脫逃人確所在內者", "所犯為死刑、無期徒刑或最輕本刑為五年以上有期徒刑之罪，嫌疑重大，有事實足認為有逃亡疑慮者", "有明顯事實足信為有人在內犯罪而情形急迫者。"], "answer": [2]}, {"id": "finalLaw1_19", "type": "single", "question": "依刑事訴訟法第88-1條的規定，檢察官、司法警察官或司法警察偵查犯罪，情況急迫，得逕行拘提的情形，下列何者為非？", "options": ["因現行犯的供述，且有事實足認為共犯嫌疑重大者", "有明顯事實足信為有人在內犯罪而情形急迫者", "在執行或在押中的脫逃者", "所犯為死刑、無期徒刑或最輕本刑為五年以上有期徒刑之罪，嫌疑重大，有事實足認為有逃亡疑慮者。"], "answer": [1]}, {"id": "finalLaw1_20", "type": "single", "question": "依刑事訴訟法第76條的規定，被告犯罪嫌疑重大，得不經傳喚逕行拘提的情形，下列何者為非？", "options": ["所犯為死刑、無期徒刑或最輕本刑為三年以上有期徒刑之罪者", "無一定的住、居所者", "逃亡或有事實足認為有逃亡疑慮者", "有事實足認為有湮滅、偽造、變造證據或勾串共犯或證人疑慮者。"], "answer": [0]}] },
finalLaw2: { name: "期末考法律｜海巡署常見犯罪案例介紹（含貪污、詐欺等）", category: 'finalLaw', questions: [{"id": "finalLaw2_1", "type": "single", "question": "海巡隊副隊長甲，為取得後續走私情資，受友人之託，改變海巡艇執勤模式及實施掩護乙走私香菸進入臺灣地區。試問，甲應成立何罪？", "options": ["懲治走私條例第9條之放行走私罪", "懲治走私條例第10條之包庇走私罪", "貪污治罪條例第5條之違背職務期約不正利益罪", "貪污治罪條例第6條之圖利罪。"], "answer": [1]}, {"id": "finalLaw2_2", "type": "single", "question": "下列法律，何者具有「母法與子法」的關係？", "options": ["民法總則與民法親屬", "刑法與貪污治罪條例", "國家賠償法與國家賠償施行細則", "民法與民事訴訟法。"], "answer": [2]}, {"id": "finalLaw2_3", "type": "single", "question": "甲為國軍現役中校軍官，為向友人炫耀，將部隊槍枝攜回把玩，經人檢舉，你是查獲該案的員警，應如何處置？", "options": ["甲為現役軍人應移送軍事法院檢察署追訴", "甲觸犯之罪為貪污治罪條例第4條竊占公用器材、財物，應移送地方法院檢察署追訴", "甲觸犯陸海空軍刑法第64條之罪，應移送軍事法院檢察署追訴", "甲觸犯陸海空軍刑法第64條之罪，應移送地方法院檢察署追訴。"], "answer": [3]}, {"id": "finalLaw2_4", "type": "single", "question": "有關地方行政首長之停止職務與解除職務規定，下列何者正確？", "options": ["涉嫌犯貪污治罪條例之罪，經檢察官提起公訴者，應被停止職務", "依刑事訴訟程序被通緝者，應被停止職務", "犯貪污罪經第一審判處有期徒刑以上之刑者，解除其職務", "因故不執行職務連續達任期二分之一者，解除其職務。"], "answer": [1]}, {"id": "finalLaw2_5", "type": "single", "question": "法律可分為普通法與特別法，下列何者為普通法？", "options": ["陸海空軍刑法", "懲治走私條例", "中華民國刑法", "貪污治罪條例。"], "answer": [2]}, {"id": "finalLaw2_6", "type": "single", "question": "下列何者不是憲法第170條所稱之法律？", "options": ["貪污治罪條例", "國防大學組織規程", "軍事審判法施行法", "陸海空軍刑法。"], "answer": [1]}, {"id": "finalLaw2_7", "type": "single", "question": "依貪污治罪條例第6條之1的財產來源不實說明罪規定，檢察官於偵查中，發現公務員本人及其配偶、未成年子女自涉嫌犯罪時及其後幾年內，任一年間所增加之財產總額超過其最近一年度合併申報之綜合所得總額時，即得命本人就來源可疑之財產提出說明？", "options": ["2年", "3年", "4年", "5年。"], "answer": [1]}, {"id": "finalLaw2_8", "type": "single", "question": "依貪污治罪條例第8條規定，下列何種情況可以獲得法院免除其刑之機會？", "options": ["犯罪後自首", "偵查中自白，並自動繳交全部所得財物", "偵查中供出共犯，並因而查獲共犯者", "犯罪後自首，如有所得並自動繳交全部所得財物者。"], "answer": [3]}, {"id": "finalLaw2_9", "type": "single", "question": "依據貪污治罪條例中財產來源不明罪之規定，下列何人有財產增加與收入顯不相當之情形時，公務員負有說明義務？", "options": ["其父母", "其已離婚之前配偶", "其未成年子女", "其兄弟姐妹。"], "answer": [2]}, {"id": "finalLaw2_10", "type": "single", "question": "下列何種情形應依貪污治罪條例論處？", "options": ["縣長結婚收取符合一般社會通念之禮金", "公立醫院住院醫師收受病患餽贈勞力士金錶", "市政府總務科科長接受工程包商性招待", finalLaw3: { name: "期末考法律｜懲治走私條例", category: 'finalLaw', questions: [{"id": "finalLaw3_1", "type": "single", "question": "依懲治走私條例的規定，稽徵關員或其他依法令負責檢查人員，明知為走私物品而放行或為的銷售或藏匿者，其處罰為：", "options": ["三年以上有期徒刑", "五年以上有期徒刑", "七年以上有期徒刑", "無期徒刑。"], "answer": [2]}, {"id": "finalLaw3_2", "type": "single", "question": "我國人民自大陸地區私運管制物品進入臺灣地區，應依下列何種規定處置？", "options": ["懲治走私條例第 2 條規定", "懲治走私條例第 2 條、第 12 條規定", "臺灣地區與大陸地區人民關係條例第 79 條規定", "國家安全法第 6 條規定。"], "answer": [1]}, {"id": "finalLaw3_3", "type": "single", "question": "「管制物品管制品項及管制方式」中有關管制進口物品所規定價額及重量，係指下列何者？", "options": ["逃漏稅額新台幣10萬元或重量一千公斤以上", "完稅價額新台幣10萬元或重量一千公斤以上", "完稅價額新台幣10萬元或重量一千公斤以下", "逃漏稅額新台幣10萬元或重量一千公斤以下。"], "answer": [1]}, {"id": "finalLaw3_4", "type": "single", "question": "「懲治走私條例」的管制物品及其數額由下列何者公告的？", "options": ["立法院", "司法院", "行政院", "總統府。"], "answer": [2]}, {"id": "finalLaw3_5", "type": "single", "question": "「懲治走私條例」規定，私運管制物品進口、出口者，處：", "options": ["五年以下有期徒刑，得併科新臺幣三百萬元以下罰金", "七年以下有期徒刑，得併科新臺幣三百萬元以下罰金", "七年以下有期徒刑，得併科新臺幣四百萬元以下罰金", "七年以下有期徒刑，得併科新臺幣二百萬元以下罰金。"], "answer": [1]}, {"id": "finalLaw3_6", "type": "single", "question": "依懲治走私條例第3條規定，運送第2條第1項的走私物品者，處：", "options": ["三年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金", "五年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金", "一年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金", "七年以下有期徒刑、拘役或科或併科新臺幣一百五十萬元以下罰金。"], "answer": [1]}, {"id": "finalLaw3_7", "type": "single", "question": "依懲治走私條例第9條規定，稽徵關員或其他依法令負責檢查人員，明知為走私物品而放行或為的銷售或藏匿者，處：", "options": ["三年以上有期徒刑", "二年以上有期徒刑", "五年以上有期徒刑", "七年以上有期徒刑。"], "answer": [3]}, {"id": "finalLaw3_8", "type": "single", "question": "依懲治走私條例第10條規定，公務員包庇走私者，處：", "options": ["無期徒刑或三年以上有期徒刑", "無期徒刑或二年以上有期徒刑", "無期徒刑或五年以上有期徒刑", "無期徒刑或七年以上有期徒刑。"], "answer": [3]}, {"id": "finalLaw3_9", "type": "single", "question": "依懲治走私條例第7條規定，服務於鐵路、公路、航空、水運或其他供公眾運輸的交通工具人員，明知有走私情事而不通知稽徵關員或其他依法令負責檢查人員者，處：", "options": ["二年以下有期徒刑、拘役或科新臺幣一百五十萬元以下罰金。", "五年以下有期徒刑、拘役或科新臺幣一百五十萬元以下罰金。", "一年以下有期徒刑、拘役或科新臺幣一百五十萬元以下罰金。", "三年以下有期徒刑、拘役或科新臺幣一百五十萬元以下罰金。"], "answer": [3]}, {"id": "finalLaw3_10", "type": "single", "question": "依懲治走私條例第12條規定，自 finalLaw4: { name: "期末考法律｜國家安全法及其施行細則", category: 'finalLaw', questions: [{"id": "finalLaw4_1", "type": "single", "question": "下列何者不是為國安法規範事項？", "options": ["入出境及境內安全檢查", "入出管制區的許可", "生態保護區的查察", "管制區的禁建。"], "answer": [2]}, {"id": "finalLaw4_2", "type": "single", "question": "警察或海岸巡防機關於必要時，對下列哪些事項，得依其職權實施檢查？", "options": ["入出境的旅客及其所攜帶的物件", "沒有入出境的航空器", "航行境外的船筏", "交付公務上應秘密的圖畫。"], "answer": [1]}, {"id": "finalLaw4_3", "type": "single", "question": "國安法的入出境，指的是？", "options": ["僅指入出金門地區", "入出臺灣地區", "僅指入出澎湖地區", "入出大陸地區。"], "answer": [1]}, {"id": "finalLaw4_4", "type": "single", "question": "臺灣地區依據「臺灣地區與大陸地區人民關係條例」第2條，指的是？", "options": ["澎湖地區", "金門地區", "馬祖地區", "臺灣、澎湖、金門、馬祖及政府統治權所及的其他地區 。"], "answer": [3]}, {"id": "finalLaw4_5", "type": "single", "question": "國安法有關入出境船舶及其載運人員、物品的檢查，何者為非？", "options": ["核對證照與艙單", "得作清艙檢查", "實施儀器檢查或搜索其身體", "不得對進口的貨櫃實施落地檢查。"], "answer": [3]}, {"id": "finalLaw4_6", "type": "single", "question": "航行境內航空器及其載運人員、物品的檢查，準用國安法第幾條規定辦理？", "options": ["第19條第1項", "第19條第2項", "第20條", "第18條第1項。"], "answer": [0]}, {"id": "finalLaw4_7", "type": "single", "question": "國安法施行細則第22條有關旅客於登船時，得查驗哪一事項？", "options": ["核對證照", "身分證明", "清艙檢查", "所攜帶的寵物。"], "answer": [1]}, {"id": "finalLaw4_8", "type": "single", "question": "為確保海防及軍事設施安全，並維護山地治安，得由哪一機關會同內政部指定海岸、山地或重要軍事設施地區，劃為管制區，並公告的？", "options": ["海巡署", "國防部", "海關", "港務局。"], "answer": [1]}, {"id": "finalLaw4_9", "type": "single", "question": "我國海岸管制區如何劃定？", "options": ["由國防部會同內政部根據海防實際需要劃定公告", "臺灣地區海岸的海水低潮線以迄高潮線起算三百公尺以內的地區", "臺灣地區海岸的海水低潮線以迄高潮線起算四百公尺以內的地區", "臺灣地區海岸的海水低潮線以迄高潮線起算六百公尺以內的地區。"], "answer": [0]}, {"id": "finalLaw4_10", "type": "single", "question": "我國海岸經常管制區的定義，何者為是？", "options": ["規定時間內，開放供人民從事觀光活動的地區", "規定時間內，開放供人民從事旅遊活動的地區", "規定時間內，開放供人民從事岸釣活動的地區", "為確保海防安全，經常實施管制的地區。"], "answer": [3]}, {"id": "finalLaw4_11", "type": "single", "question": "下列何者非人民入出海岸管制區，無須申請許可的情形？", "options": ["規定開放時間內，入出海岸特定管制區者", "非因公務需要入出海岸管制區者", "戶籍設於海岸管制區或依法得使用的土地位於海岸管制區者", "當地漁民入出海岸管制區的海岸捕魚、養殖或採收海產者。"], "answer": [1]}, {"id": "fina finalLaw5: { name: "期末考法律｜動植物檢疫相關規定", category: 'finalLaw', questions: [{"id": "finalLaw5_1", "type": "single", "question": "動物疫病之傳播途徑風險之敘述何者錯誤?", "options": ["走私動物及其產品風險最高", "候鳥途經台灣帶來病原的風險次之", "於通商港埠經合法檢疫管道進口的動物及其產品無風險", "入境旅客機械性攜入病原的風險最低。"], "answer": [2]}, {"id": "finalLaw5_2", "type": "single", "question": "「動物傳染病防治條例」第一章總則之敘述何者正確?", "options": ["目的在防治動物傳染病之發生、傳染及蔓延", "規定各級主管機關、動物防疫檢疫機關之設置人員之權限", "防治事項、動物種類、檢疫物範圍、動物傳染病種類、有關機關之配合等", "以上皆是。"], "answer": [3]}, {"id": "finalLaw5_3", "type": "single", "question": "為防治動物傳染病之發生，得令動物防疫人員施行動物生體檢查__", "options": ["藥浴或投藥", "預防注射", "投與疫苗", "以上皆是。"], "answer": [3]}, {"id": "finalLaw5_4", "type": "single", "question": "化製原料運輸車裝卸、載運化製原料時，何者不符合規定?", "options": ["具有消毒設備、防漏密閉設備", "不須維護即可功能正常", "接受主管機關查核，並通報相關事項", "將合格證黏貼於車上。"], "answer": [1]}, {"id": "finalLaw5_5", "type": "single", "question": "動物防疫人員認有必要時，其所有人或管理人應依動物防疫人員之指導，撲殺並予__或其他必要之處置?", "options": ["燒燬", "掩埋", "化製", "以上皆是。"], "answer": [3]}, {"id": "finalLaw5_6", "type": "single", "question": "有關「動物傳染病防治條例」第四章之敘述何者錯誤?", "options": ["規定輸出入動物檢疫之檢疫條件、申請等事項", "檢疫機關之任務、防疫機關應配合事項", "規定動物防疫檢疫機關之設置人員之權限", "輸出入人或其代理人及運輸人員應遵行之事項等。"], "answer": [2]}, {"id": "finalLaw5_7", "type": "single", "question": "我國動物傳染病防治條例所稱的防治不包括下列何種業務？", "options": ["預防", "防疫", "治療", "檢疫。"], "answer": [2]}, {"id": "finalLaw5_8", "type": "single", "question": "『動物傳染病防治條例』在中央為主管機關為何?", "options": ["警政署", "海保署", "漁業署", "農業部。"], "answer": [3]}, {"id": "finalLaw5_9", "type": "single", "question": "有關植物檢疫目的之敘述何者正確?", "options": ["提高進口農產品國際競爭力", "維持我國為重要有害生物非疫區狀態", "工業生產環境之安全與永續利用", "增加國外有害生物隨農產品之貿易流通而入侵國境。"], "answer": [1]}, {"id": "finalLaw5_10", "type": "single", "question": "何者非我國歷年入侵之有害生物?", "options": ["小花蔓澤蘭", "隱翅蟲", "刺桐釉小蜂", "福壽螺。"], "answer": [1]}, {"id": "finalLaw5_11", "type": "single", "question": "下列何者非植物檢疫相關規定?", "options": ["動植物檢疫要點", "植物防疫檢疫法", "植物防疫及檢疫執行辦法", "特定植物或植物產品輸入核准辦法。"], "answer": [0]}, {"id": "finalLaw5_12", "type": "single", "question": "____轉運植物或植物產品，應於到達港、站前，由輸入人或其代理人向植物檢疫機關申請檢疫", "options": ["輸入", "過境", "轉口", "以上皆是。"], "answer": [3]}, {"id": "finalLaw5_13", "type": "single", "question": "檢疫作業模式何者錯誤?", "options": ["產地檢疫", "發動檢疫", "隔離檢疫", "木質包裝材檢疫。"], "answer": [1]}, {"id": "finalLaw5_14", "type": "single", "question": "違反植物防疫檢疫法第十四條或第十五條規定，擅自輸入或轉運者，處多久以下有期徒刑?", "options": ["一年", "三年", "五年", "十年。"], "answer": [1]}, {"id": "finalLaw5_15", "type": "single", "question": "依照植物防疫檢疫法，旅客或服務於車、船、航空器人員未依規定申請檢疫者，處新臺幣?元以上罰鍰。", "options": ["3000", "5000", "1000", "8000。"], "answer": [0]}, {"id": "finalLaw5_16", "type": "single", "question": "何者為植物防疫檢疫法第十七條規定申報義務?", "options": ["貨運", "旅客", "郵包", "以上皆是。"], "answer": [1]}, {"id": "finalLaw5_17", "type": "single", "question": "臨場檢疫順序為何?1.派員檢疫2.申請檢疫3.後續處置4.文件審核5.結果判定", "options": ["12534", "24135", "24153", "13245。"], "answer": [2]}, {"id": "finalLaw5_18", "type": "single", "question": "鮮果實蔬菜類10櫃以下臨場檢疫開櫃數為何?", "options": ["3櫃", "5櫃", "10櫃", "7櫃。"], "answer": [0]}, {"id": "finalLaw5_19", "type": "single", "question": "輸入鳳梨之生植株或具繁殖力之營養體，應實施隔離檢疫多久?", "options": ["一年", "二年", "三年", "四年。"], "answer": [1]}, {"id": "finalLaw5_20", "type": "single", "question": "何者為輸入隔離期間至少一年植物之生植株或具繁殖力之營養體?1.番石榴2.龍眼3.甘蔗4.香蕉5.荔枝", "options": ["123", "234", "135", "125。"], "answer": [3]}] },
finalPro1: { name: "期末考專業｜查艙技巧及實務研討", category: 'finalPro', questions: [{"id": "finalPro1_1", "type": "single", "question": "巡防機關人員於港口實施登船檢查前，應事先蒐集、檢視受檢船舶之相關資料，足認其有可疑或有違法之虞時，始發動", "options": ["檢查", "監卸", "清艙", "搜索。"], "answer": [0]}, {"id": "finalPro1_2", "type": "single", "question": "對於進出港口或於航道航行之可疑船舶發動檢查時，應以", "options": ["警示燈", "擴音機", "廣播", "國旗及發光信號等方法要求其停船。以上何者為「非」?"], "answer": [3]}, {"id": "finalPro1_3", "type": "single", "question": "對於不遵守停船命令之船舶，應即實施蒐證並通報", "options": ["鄰近雷達", "守望哨", "海巡隊巡防艦艇", "以上皆是，掌握該船舶動態並實施海域登臨檢查。"], "answer": [3]}, {"id": "finalPro1_4", "type": "single", "question": "海岸巡防機關人員於港區船舶安檢檢查時，對情資顯示有走私、非法入出國之嫌，但無明顯違法事證者，得實施", "options": ["普檢及監卸", "抽檢及清艙", "扣押及查封", "抽檢及監卸，且以有船艙之船隻為主。"], "answer": [3]}, {"id": "finalPro1_5", "type": "single", "question": "多艘船同時進港，且漁獲數量多，安檢人力不敷使用時，以輔助安檢不足為", "options": ["巡邏", "監卸", "守望", "值班"], "answer": [1]}, {"id": "finalPro1_6", "type": "single", "question": "檢查過程發現可疑情形，有正當理由認有違法之虞時，始得會同船員檢查", "options": ["私人空間與物品", "駕駛艙與物品", "機艙與物品", "漁艙與物品。"], "answer": [0]}, {"id": "finalPro1_7", "type": "single", "question": "『為維護臺灣地區海域及海岸秩序，與資源之保護利用，確保國家安全，保障人民權益，特制定本法』。以上為何法律", "options": ["海岸巡防法", "國安法", "憲法", "社會秩序維護法。"], "answer": [0]}, {"id": "finalPro1_8", "type": "single", "question": "該查艙方法係在檢查船身外有無密(窩)艙或懸掛私貨於水中之檢查方法為?", "options": ["燈測法", "檢視法", "絆撈法", "鑽探法。"], "answer": [2]}, {"id": "finalPro1_9", "type": "single", "question": "該查艙方法係在漁船進港尖峰時或漁貨較多且漁貨底下可能藏放違禁物品無法徹底清艙檢查時之檢查方法為?", "options": ["鑽探法", "追蹤法", "敲擊法", "檢視法"], "answer": [1]}, {"id": "finalPro1_10", "type": "single", "question": "該查艙方法係以利用敲擊法察知設有密艙(窩)或發現新痕、扳動過之木板及可疑板壁者，接續以螺絲起子、板手、鐵鎚等工具查看之檢查方法為?", "options": ["鑽探法", "檢視法", "工具法", "撬板法"], "answer": [3]}, {"id": "finalPro1_11", "type": "single", "question": "執行要領為派員至漁市場全程監督卸魚，且「邊卸邊檢」俟將漁貨全部卸完，再進艙徹底檢查，能兼顧「安全與便民」在人力許可下，能有效實施此檢查之方法為?", "options": ["檢視法", "追蹤法", "監視法", "卸漁法"], "answer": [1]}, {"id": "finalPro1_12", "type": "single", "question": "查艙技巧中「敲擊法」要領為何？", "options": ["對漁艙內之碎冰、漁網、油(水)櫃、黃油桶之刺探。", "以工具敲擊板壁，聽 const questionCategories = {
  finalLaw: { name: "期末考｜法律", keys: Object.keys(questionBank).filter(key => key.startsWith("finalLaw")) },
  finalPro: { name: "期末考｜專業", keys: Object.keys(questionBank).filter(key => key.startsWith("finalPro")) }
};

let selectedBankKeys = new Set();
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let userAnswers = {};
let wrongQuestions = [];
let quizMode = "normal";
function beginSelectedQuiz() {
startSelectedBanks();
if (!currentQuestions.length) {
showToast("請至少選擇一個題庫，再開始作答。");
return;
}
if (isDroneOnlySelection() && !applyDroneRandomCount()) return;
currentQuestions = shuffleQuestionOptions(currentQuestions);
document.getElementById("selectionArea").style.display = "none";
document.getElementById("quizArea").style.display = "block";
renderQuestion();
window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggleBankMenu(force) {
const menu = document.getElementById("bankPickerMenu");
const button = document.getElementById("bankMenuToggle");
if (!menu || !button) return;
const shouldOpen = typeof force === "boolean" ? force : !menu.classList.contains("open");
menu.classList.toggle("open", shouldOpen);
button.setAttribute("aria-expanded", String(shouldOpen));
button.querySelector(".bank-menu-label").textContent = shouldOpen ? "關閉題庫選單" : "開啟題庫選單";
}

function isDroneOnlySelection() {
const keys = [...selectedBankKeys];
return keys.length > 0 && keys.every(key => questionCategories.drone?.keys.includes(key));
}

const droneUsedStorageKey = "coastGuardDroneUsedQuestions";
function droneSelectionKey() {
return [...selectedBankKeys].filter(key => questionCategories.drone?.keys.includes(key)).sort().join("|");
}
function readDroneUsedMap() {
try { return JSON.parse(localStorage.getItem(droneUsedStorageKey) || "{}"); }
catch (error) { return {}; }
}
function writeDroneUsedMap(map) {
try { localStorage.setItem(droneUsedStorageKey, JSON.stringify(map)); } catch (error) {}
}
function getDroneUsedIds() {
const key = droneSelectionKey();
if (!key) return new Set();
const map = readDroneUsedMap();
return new Set(Array.isArray(map[key]) ? map[key] : []);
}
function markDroneUsed(ids) {
const key = droneSelectionKey();
if (!key) return;
const map = readDroneUsedMap();
const idsSet = new Set(Array.isArray(map[key]) ? map[key] : []);
ids.forEach(id => idsSet.add(id));
map[key] = Array.from(idsSet);
writeDroneUsedMap(map);
}
function resetDroneQuestionPool() {
const key = droneSelectionKey();
if (!key) return;
const map = readDroneUsedMap();
delete map[key];
writeDroneUsedMap(map);
updateDroneQuestionControls();
showToast("已重新開始抽題，所有無人機題目都可再次抽出。");
}

function updateDroneQuestionControls() {
const panel = document.getElementById("droneRandomControls");
if (!panel) return;
const visible = isDroneOnlySelection();
panel.classList.toggle("visible", visible);
if (!visible) return;
const allAvailable = [...selectedBankKeys].reduce((total, key) => total + (questionBank[key]?.questions.length || 0), 0);
const used = getDroneUsedIds();
const available = Math.max(0, allAvailable - used.size);
const input = document.getElementById("droneQuestionCount");
input.max = Math.max(1, available);
const entered = input.value.trim();
if (entered !== "" && Number(input.value) > available && available > 0) input.value = available;
if (entered !== "" && (!Number.isFinite(Number(input.value)) || Number(input.value) < 1)) input.value = "";
document.getElementById("droneRandomNote").textContent = available > 0 ? `尚有 ${available} / ${allAvailable} 題未抽過，請輸入要隨機抽出的題數。` : "本組題庫已全部抽過，開始抽題時會自動重新開始。";
}

function applyDroneRandomCount() {
const input = document.getElementById("droneQuestionCount");
const raw = input?.value?.trim() || "";
let pool = currentQuestions.filter(question => !getDroneUsedIds().has(question.id));
if (!pool.length) {
  resetDroneQuestionPool();
  pool = [...currentQuestions];
}
const count = Math.floor(Number(raw));
if (!raw || !Number.isFinite(count) || count < 1 || count > pool.length) {
  showToast(`請輸入 1 至 ${pool.length} 題。`);
  if (input) input.focus();
  return false;
}
currentQuestions = [...pool].sort(() => Math.random() - 0.5).slice(0, count);
markDroneUsed(currentQuestions.map(question => question.id));
return true;
}

function updateSelectionUI() {
const summary = document.getElementById("selectionSummary");
const actionPanel = document.getElementById("quizActionPanel");
if (!summary || !actionPanel) return;
const count = selectedBankKeys.size;
const total = [...selectedBankKeys].reduce((sum, key) => sum + (questionBank[key]?.questions.length || 0), 0);
summary.textContent = count ? `已選擇 ${count} 個題庫，共 ${total} 題` : "尚未選擇題庫";
actionPanel.hidden = count === 0;
}

function getSavedTheme() {
try { return localStorage.getItem("coastGuardTheme") || "light"; }
catch (error) { return document.documentElement.dataset.theme || "light"; }
}
function applySavedTheme() {
const theme = getSavedTheme() === "dark" ? "dark" : "light";
document.documentElement.dataset.theme = theme;
document.body.classList.toggle("dark-mode", theme === "dark");
document.querySelectorAll(".theme-control").forEach(button => {
  if (button.id === "themeFab") button.textContent = theme === "dark" ? "☀" : "☾";
  else button.textContent = theme === "dark" ? "☀️ 淺色模式" : "☾ 深色模式";
  button.setAttribute("aria-pressed", String(theme === "dark"));
});
}
function toggleTheme() {
const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
try { localStorage.setItem("coastGuardTheme", next); } catch (error) {}
document.documentElement.dataset.theme = next;
document.body.classList.toggle("dark-mode", next === "dark");
applySavedTheme();
}

// 初始化題庫選擇器
function initSelect() {
const picker = document.getElementById("bankPicker");
if (!picker) return;
picker.innerHTML = "";
for (const categoryKey of Object.keys(questionCategories)) {
  const category = questionCategories[categoryKey];
  const group = document.createElement("div");
  group.className = "bank-category";
  const header = document.createElement("div");
  header.className = "bank-category-header";
  const title = document.createElement("strong");
  title.textContent = category.name;
  const categoryBtn = document.createElement("button");
  categoryBtn.type = "button";
  categoryBtn.className = "category-select-btn";
  categoryBtn.textContent = "選取此類別";
  categoryBtn.onclick = () => selectCategoryBanks(categoryKey);
  header.append(title, categoryBtn);
  group.appendChild(header);
  const options = document.createElement("div");
  options.className = "bank-category-options";
  for (const key of category.keys) {
    const label = document.createElement("label");
    label.className = "bank-option";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = key;
    checkbox.checked = selectedBankKeys.has(key);
    checkbox.onchange = updateSelectedBanks;
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(questionBank[key].name));
    options.appendChild(label);
  }
  group.appendChild(options);
  picker.appendChild(group);
}
startSelectedBanks();
updateDroneQuestionControls();
updateSelectionUI();
}
function updateSelectedBanks() {
const checked = [...document.querySelectorAll("#bankPicker input:checked")];
const checkedCategories = Object.keys(questionCategories).filter(categoryKey =>
  checked.some(input => questionCategories[categoryKey].keys.includes(input.value))
);
if (checkedCategories.length > 1) {
  const activeCategory = checkedCategories[checkedCategories.length - 1];
  const allowed = new Set(questionCategories[activeCategory].keys);
  document.querySelectorAll("#bankPicker input").forEach(input => {
    input.checked = allowed.has(input.value) && input.checked;
  });
}
selectedBankKeys = new Set([...document.querySelectorAll("#bankPicker input:checked")].map(input => input.value));
updateDroneQuestionControls();
updateSelectionUI();
}
function selectCategoryBanks(categoryKey) {
const category = questionCategories[categoryKey];
if (!category) return;
const categoryKeys = new Set(category.keys);
document.querySelectorAll("#bankPicker input").forEach(input => {
  input.checked = categoryKeys.has(input.value);
});
selectedBankKeys = new Set(category.keys);
startSelectedBanks();
updateDroneQuestionControls();
updateSelectionUI();
toggleBankMenu(false);
}
function clearBankSelection() {
document.querySelectorAll("#bankPicker input").forEach(input => input.checked = false);
selectedBankKeys.clear();
currentQuestions = [];
currentIndex = 0;
score = 0;
userAnswers = {};
updateDroneQuestionControls();
updateSelectionUI();
renderQuestion();
}
// 載入所選的一個或多個題庫
function startSelectedBanks() {
updateSelectedBanks();
const keys = [...selectedBankKeys];
currentQuestions = keys.flatMap(key => questionBank[key] ? questionBank[key].questions : []);
currentIndex = 0;
score = 0;
userAnswers = {};
quizMode = "normal";
document.getElementById("quizArea").style.display = "none";
document.getElementById("resultArea").style.display = "none";
renderQuestion();
}
// 隨機抽題並重置；無人機題庫會依使用者指定題數抽取
// 每次開始作答時，隨機打亂每題選項順序（「以上皆是／以上皆非」等選項固定在最後）
function shuffleQuestionOptions(list) {
return list.map(q => {
const pinnedRe = /^以上(皆|都|全)/;
const items = q.options.map((text, i) => ({ text, correct: q.answer.includes(i) }));
const free = items.filter(o => !pinnedRe.test(o.text));
const pinned = items.filter(o => pinnedRe.test(o.text));
for (let i = free.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[free[i], free[j]] = [free[j], free[i]];
}
const merged = [...free, ...pinned];
return { ...q, options: merged.map(o => o.text), answer: merged.map((o, i) => o.correct ? i : -1).filter(i => i >= 0) };
});
}

function shuffleAndReset() {
startSelectedBanks();
if (!currentQuestions.length) {
showToast("請至少選擇一個題庫。");
return;
}
if (isDroneOnlySelection() && !applyDroneRandomCount()) return;
else if (!isDroneOnlySelection()) currentQuestions = [...currentQuestions].sort(() => Math.random() - 0.5);
currentQuestions = shuffleQuestionOptions(currentQuestions);
document.getElementById("selectionArea").style.display = "none";
document.getElementById("quizArea").style.display = "block";
renderQuestion();
}
let toastTimer;

function showToast(message) {
const toast = document.getElementById("toast");
if (!toast) return;
toast.textContent = message;
toast.className = "";
void toast.offsetWidth;
toast.className = "toast-show";
clearTimeout(toastTimer);
toastTimer = setTimeout(() => { toast.className = ""; }, 1700);
}

function celebrateCorrect() {
const layer = document.getElementById("celebrationLayer");
if (!layer) return;
const colors = ["#d5a928", "#0a659c", "#168a66", "#e56b6f", "#062f54"];
layer.innerHTML = "";
for (let i = 0; i < 26; i++) {
const piece = document.createElement("span");
piece.className = "confetti";
piece.style.left = `${Math.random() * 100}%`;
piece.style.backgroundColor = colors[i % colors.length];
piece.style.setProperty("--drift", `${Math.round((Math.random() - 0.5) * 180)}px`);
piece.style.animationDelay = `${Math.random() * 0.18}s`;
layer.appendChild(piece);
}
setTimeout(() => { layer.innerHTML = ""; }, 1600);
}

// 渲染當前題目
function renderQuestion() {
if (!currentQuestions || currentQuestions.length === 0) {
document.getElementById("questionTitle").textContent = "此題庫暫無題目。";
document.getElementById("optionsContainer").innerHTML = "";
document.getElementById("progressText").textContent = "進度：0 / 0";
document.getElementById("scoreText").textContent = "得分：0";
const emptyProgress = document.getElementById("progressBar");
if (emptyProgress) emptyProgress.style.width = "0%";
return;
}

const q = currentQuestions[currentIndex];
document.getElementById("progressText").textContent = `進度：${currentIndex + 1} / ${currentQuestions.length}`;
document.getElementById("scoreText").textContent = `得分：${score}`;
const progressBar = document.getElementById("progressBar");
if (progressBar) progressBar.style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;
const questionPanel = document.querySelector("#quizArea > .question-card");
if (questionPanel) {
questionPanel.classList.remove("question-enter");
void questionPanel.offsetWidth;
questionPanel.classList.add("question-enter");
}
document.getElementById("questionTitle").textContent = `${currentIndex + 1}. ${q.question}${q.type === "multiple" ? "（複選）" : ""}`;

const optionsContainer = document.getElementById("optionsContainer");
optionsContainer.innerHTML = "";

const feedback = document.getElementById("feedback");
feedback.style.display = "none";
feedback.className = "result-feedback";
// 每次重新渲染題目都清空舊提示與操作按鈕，避免錯題練習時重複累加。
feedback.innerHTML = "";

const hasAnswered = Object.prototype.hasOwnProperty.call(userAnswers, currentIndex);

q.options.forEach((opt, idx) => {
const btn = document.createElement("button");
btn.className = "option-btn";
btn.textContent = `${String.fromCharCode(65 + idx)}. ${opt}`;

if (hasAnswered) {
btn.disabled = true;
const selectedIdx = userAnswers[currentIndex];
const correctIdx = q.answer[0];

if (idx === correctIdx) {
btn.classList.add("correct");
}
if (idx === selectedIdx && selectedIdx !== correctIdx) {
btn.classList.add("wrong");
}
} else {
btn.onclick = () => checkAnswer(idx);
}

optionsContainer.appendChild(btn);
});

if (hasAnswered) {
const selectedIdx = userAnswers[currentIndex];
const correctIdx = q.answer[0];
if (selectedIdx === correctIdx) {
if (quizMode === "custom") {
feedback.style.display = "block";
feedback.classList.add("correct");
const actions = document.createElement("div");
actions.className = "custom-answer-actions";
const removeBtn = document.createElement("button");
removeBtn.className = "remove-answer-btn";
removeBtn.type = "button";
removeBtn.textContent = "✓ 已學會，從錯題庫刪除";
removeBtn.onclick = () => window.removeCurrentCustomQuestion();
const keepBtn = document.createElement("button");
keepBtn.className = "keep-answer-btn";
keepBtn.type = "button";
keepBtn.textContent = "保留本題，之後繼續複習";
keepBtn.onclick = () => window.keepCurrentCustomQuestion();
actions.append(removeBtn, keepBtn);
feedback.appendChild(actions);
} else {
feedback.style.display = "none";
}
} else {
feedback.style.display = "block";
feedback.textContent = `答錯了！正確答案是：(${String.fromCharCode(65 + correctIdx)}) ${q.options[correctIdx]}`;
feedback.classList.add("wrong");
}
}

document.getElementById("prevBtn").disabled = currentIndex === 0;
document.getElementById("nextBtn").disabled = currentIndex === currentQuestions.length - 1;
}

// 檢查答案
function checkAnswer(selectedIdx) {
if (Object.prototype.hasOwnProperty.call(userAnswers, currentIndex)) return;

userAnswers[currentIndex] = selectedIdx;
const q = currentQuestions[currentIndex];
const correctIdx = q.answer[0];

if (selectedIdx === correctIdx) {
score += 5; // 每題 5 分
}

renderQuestion();
const questionPanel = document.querySelector("#quizArea > .question-card");
if (selectedIdx === correctIdx) {
celebrateCorrect();
if (navigator.vibrate) navigator.vibrate(55);
} else {
if (questionPanel) {
questionPanel.classList.remove("answer-shake");
void questionPanel.offsetWidth;
questionPanel.classList.add("answer-shake");
}
if (navigator.vibrate) navigator.vibrate([60, 35, 60]);
}
}

// 完成測驗並整理錯題
function finishQuiz() {
if (!currentQuestions.length) {
showToast("請至少選擇一個題庫。");
return;
}
if (Object.keys(userAnswers).length < currentQuestions.length) {
showToast("還有題目尚未作答，請先完成所有題目。");
return;
}
wrongQuestions = currentQuestions.filter((q, index) => userAnswers[index] !== q.answer[0]);
const total = currentQuestions.length * 5;
document.getElementById("resultTitle").textContent = quizMode === "wrong" ? "錯題重做完成" : (quizMode === "custom" ? "我的錯題庫練習完成" : "測驗完成");
document.getElementById("resultSummary").textContent = `本次答對 ${currentQuestions.length - wrongQuestions.length} / ${currentQuestions.length} 題，得分：${score} / ${total}。`;
document.getElementById("retryWrongBtn").style.display = wrongQuestions.length ? "block" : "none";
document.getElementById("quizArea").style.display = "none";
document.getElementById("resultArea").style.display = "block";
const resultArea = document.getElementById("resultArea");
resultArea.classList.remove("result-enter");
void resultArea.offsetWidth;
resultArea.classList.add("result-enter");
if (!wrongQuestions.length) {
celebrateCorrect();
}
window.scrollTo({ top: 0, behavior: "smooth" });
}

function retryWrongQuestions() {
if (!wrongQuestions.length) return;
currentQuestions = shuffleQuestionOptions([...wrongQuestions]);
currentIndex = 0;
score = 0;
userAnswers = {};
quizMode = "wrong";
document.getElementById("resultArea").style.display = "none";
document.getElementById("quizArea").style.display = "block";
renderQuestion();
}

function returnToQuizSelection() {
document.getElementById("selectionArea").style.display = "block";
startSelectedBanks();
}

// 切換題目
function prevQuestion() {
if (currentIndex > 0) {
currentIndex--;
renderQuestion();
window.scrollTo({ top: 0, behavior: 'smooth' });
}
}

function nextQuestion() {
if (currentIndex < currentQuestions.length - 1) {
currentIndex++;
renderQuestion();
window.scrollTo({ top: 0, behavior: 'smooth' });
}
}

// 使用相容性更好的 DOMContentLoaded 事件
if (document.readyState === "loading") {
document.addEventListener("DOMContentLoaded", () => { applySavedTheme(); initSelect(); });
} else {
applySavedTheme();
initSelect();
}
</script>


<script>
(function () {
  var storageKey = 'coastGuardCustomMistakeSets';
  var customSets = readSets();
  var selectedSetId = '';

  function readSets() {
    try { return JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch (e) { return []; }
  }
  function saveSets() {
    localStorage.setItem(storageKey, JSON.stringify(customSets));
    renderControls();
  }
  function getSet() { return customSets.find(function (set) { return set.id === selectedSetId; }); }
  function questionById(id) {
    for (var key in questionBank) {
      var found = questionBank[key].questions.find(function (question) { return question.id === id; });
      if (found) return found;
    }
    return null;
  }
  function setOptions() {
    var html = '<option value="">選擇自己的錯題庫</option>';
    customSets.forEach(function (set) {
      html += '<option value="' + set.id + '"' + (set.id === selectedSetId ? ' selected' : '') + '>' + set.name + '（' + set.questionIds.length + ' 題）</option>';
    });
    return html;
  }
  function renderControls() {
    var selectHtml = customSets.length ? '<select id="customSetSelect" onchange="window.selectCustomMistakeSet(this.value)">' + setOptions() + '</select><button onclick="window.practiceCustomMistakeSet()">練習此錯題庫</button><button style="background:#8b2635" onclick="window.deleteCustomMistakeSet()">刪除錯題庫</button>' : '<span style="color:#64748b">尚未建立錯題庫</span>';
    var panel = document.getElementById('customMistakePanel');
    if (panel) panel.querySelector('.custom-controls').innerHTML = selectHtml;
    var result = document.getElementById('customResultControls');
    if (result) result.innerHTML = customSets.length ? '<select id="customResultSetSelect" onchange="window.selectCustomMistakeSet(this.value)">' + setOptions() + '</select><button onclick="window.addWrongToCustomSet()">加入錯題庫</button>' : '<span style="color:#64748b">請先建立錯題庫</span>';
  }
  function createSet(inputId, noticeId) {
    var input = document.getElementById(inputId);
    var name = (input.value || '').trim();
    if (!name) { document.getElementById(noticeId).textContent = '請先輸入錯題庫名稱。'; return; }
    var set = { id: 'custom_' + Date.now(), name: name, questionIds: [] };
    customSets.push(set); selectedSetId = set.id; input.value = ''; saveSets();
    document.getElementById(noticeId).textContent = '已建立「' + name + '」錯題庫。';
  }
  window.selectCustomMistakeSet = function (id) { selectedSetId = id; renderControls(); };
  window.keepCurrentCustomQuestion = function () {
    var actions = document.querySelector('.custom-answer-actions');
    if (actions) {
      actions.innerHTML = '<span style="color:#168a66;font-weight:700">已保留本題，之後仍可繼續複習。</span>';
    }
    if (typeof showToast === 'function') showToast('已保留本題');
  };
  window.removeCurrentCustomQuestion = function () {
    if (typeof quizMode === 'undefined' || quizMode !== 'custom') return;
    var question = currentQuestions[currentIndex];
    var set = getSet();
    if (!question || !set) return;
    set.questionIds = set.questionIds.filter(function (id) { return id !== question.id; });
    saveSets();
    var oldAnswers = userAnswers;
    var nextAnswers = {};
    Object.keys(oldAnswers).forEach(function (key) {
      var index = Number(key);
      if (index < currentIndex) nextAnswers[index] = oldAnswers[key];
      if (index > currentIndex) nextAnswers[index - 1] = oldAnswers[key];
    });
    userAnswers = nextAnswers;
    score = Math.max(0, score - 5);
    currentQuestions.splice(currentIndex, 1);
    if (typeof showToast === 'function') showToast('已從錯題庫移除，做得很好！');
    if (!currentQuestions.length) {
      document.getElementById('quizArea').style.display = 'none';
      document.getElementById('selectionArea').style.display = 'block';
      renderControls();
      return;
    }
    if (currentIndex >= currentQuestions.length) currentIndex = currentQuestions.length - 1;
    renderQuestion();
  };
  window.createCustomMistakeSet = function () { createSet('customSetName', 'customSetNotice'); };
  window.createCustomSetFromResult = function () { createSet('customResultSetName', 'customResultNotice'); };
  window.deleteCustomMistakeSet = function () {
    var set = getSet(); if (!set) return;
    if (!confirm('確定刪除「' + set.name + '」嗎？')) return;
    customSets = customSets.filter(function (item) { return item.id !== set.id; }); selectedSetId = ''; saveSets();
  };
  window.addWrongToCustomSet = function () {
    var select = document.getElementById('customResultSetSelect'); if (select) selectedSetId = select.value;
    var set = getSet();
    if (!set) { document.getElementById('customResultNotice').textContent = '請先選擇要收錄的錯題庫。'; return; }
    var ids = new Set(set.questionIds);
    wrongQuestions.forEach(function (question) { ids.add(question.id); });
    set.questionIds = Array.from(ids); saveSets();
    document.getElementById('customResultNotice').textContent = '已將 ' + wrongQuestions.length + ' 題加入「' + set.name + '」。';
  };
  window.practiceCustomMistakeSet = function () {
    var set = getSet();
    if (!set) { document.getElementById('customSetNotice').textContent = '請先選擇自己的錯題庫。'; return; }
    var uniqueIds = Array.from(new Set(set.questionIds || []));
    if (uniqueIds.length !== (set.questionIds || []).length) {
      set.questionIds = uniqueIds;
      saveSets();
    }
    var qs = uniqueIds.map(questionById).filter(Boolean);
    if (!qs.length) { document.getElementById('customSetNotice').textContent = '這個錯題庫目前沒有題目。'; return; }
    currentQuestions = shuffleQuestionOptions(qs); currentIndex = 0; score = 0; userAnswers = {}; quizMode = 'custom';
    document.getElementById('selectionArea').style.display = 'none'; document.getElementById('resultArea').style.display = 'none'; document.getElementById('quizArea').style.display = 'block'; renderQuestion();
  };
  function addPanels() {
    var selection = document.getElementById('selectionArea');
    if (selection && !document.getElementById('customMistakePanel')) {
      var panel = document.createElement('div'); panel.id = 'customMistakePanel'; panel.className = 'question-card'; panel.style.marginTop = '18px';
      panel.innerHTML = '<div class="question-title">我的錯題庫（所有人共用，可新增或刪除題目）</div><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="customSetName" placeholder="例如：海巡勤務錯題" style="flex:1;min-width:210px;padding:11px;border:1px solid #ccd5dc;border-radius:8px"><button onclick="window.createCustomMistakeSet()">＋新增錯題庫</button></div><div class="custom-controls" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div><div id="customSetNotice" class="result-feedback wrong" style="display:block;min-height:0"></div>';
      selection.appendChild(panel);
    }
    var result = document.getElementById('resultArea');
    if (result && !document.getElementById('customResultPanel')) {
      var box = document.createElement('div'); box.id = 'customResultPanel'; box.className = 'question-card'; box.style.marginTop = '14px';
      box.innerHTML = '<div class="question-title">將本次錯題加入自己的錯題庫</div><div id="customResultControls" style="display:flex;gap:8px;flex-wrap:wrap"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="customResultSetName" placeholder="輸入新錯題庫名稱" style="flex:1;min-width:210px;padding:11px;border:1px solid #ccd5dc;border-radius:8px"><button onclick="window.createCustomSetFromResult()">新增錯題庫</button></div><div id="customResultNotice" class="result-feedback correct" style="display:block;min-height:0"></div>';
      result.insertBefore(box, result.firstChild);
    }
    renderControls();
  }
  var oldFinish = window.finishQuiz;
  window.finishQuiz = function () { oldFinish(); addPanels(); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addPanels); else addPanels();
})();
</script>
