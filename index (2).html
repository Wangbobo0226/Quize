<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海巡法規與勤務線上測驗系統</title>
<style>
:root {
--primary-color: #062f54;
--secondary-color: #0a659c;
--accent-color: #d5a928;
--wrong-color: #dc3545;
--success-color: #168a66;
--bg-color: #e8f0f5;
--card-bg: #ffffff;
}

* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}

body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
background: linear-gradient(145deg, #dcebf3 0%, #f7fafc 55%, #dce8ef 100%);
color: #333;
margin: 0;
padding: 12px;
display: flex;
justify-content: center;
min-height: 100vh;
overflow-x: hidden;
}

.container {
width: 100%;
max-width: 800px;
background: var(--card-bg);
padding: 20px 16px;
border-radius: 12px;
box-shadow: 0 18px 45px rgba(6, 47, 84, 0.14), 0 4px 15px rgba(0, 0, 0, 0.06);
animation: pageEnter .55s ease both;
}

.brand-header {
background: linear-gradient(135deg, #062f54, #0b6c9f);
color: #fff;
margin: -20px -16px 20px;
padding: 24px 20px 22px;
border-radius: 12px 12px 0 0;
position: relative;
overflow: hidden;
box-shadow: inset 0 -1px rgba(255,255,255,.18);
}

.brand-header::before {
content: "";
position: absolute;
width: 220px;
height: 220px;
right: -80px;
top: -130px;
border: 1px solid rgba(255,255,255,.18);
border-radius: 50%;
box-shadow: 0 0 0 18px rgba(255,255,255,.04), 0 0 0 36px rgba(255,255,255,.03);
}

.brand-header::after {
content: "⚓ 〰 〰 〰";
position: absolute;
right: 14px;
bottom: 8px;
font-size: 1.4rem;
letter-spacing: 5px;
color: rgba(255,255,255,.22);
}

.brand-header h1 {
color: #fff;
text-align: left;
margin: 0;
}

.brand-subtitle {
margin-top: 7px;
font-size: .88rem;
letter-spacing: 1px;
color: #d9eef8;
}

.section-label {
font-weight: 700;
color: var(--primary-color);
margin: 0 0 7px;
font-size: .95rem;
}

.start-btn {
background: linear-gradient(135deg, #d5a928, #b88910);
color: #fff;
font-size: 1.08rem;
font-weight: 700;
letter-spacing: 1px;
box-shadow: 0 3px 8px rgba(126, 93, 0, .25);
}

h1 {
text-align: center;
color: var(--primary-color);
margin: 0 0 20px 0;
font-size: 1.5rem;
line-height: 1.3;
}

.control-panel {
display: flex;
gap: 10px;
margin-bottom: 16px;
flex-direction: column;
}

.bank-category {
display: flex;
flex-direction: column;
gap: 6px;
padding: 10px;
border: 1px solid #d5e2eb;
border-radius: 8px;
background: #fff;
}

.bank-category-header {
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
color: var(--primary-color);
}

.category-select-btn {
width: auto;
padding: 6px 9px;
font-size: .78rem;
background: #5c7280;
}

.bank-category-options {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 2px 8px;
}

.bank-picker {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
gap: 8px;
padding: 10px;
border: 1px solid #dee2e6;
border-radius: 8px;
background: #f8f9fa;
}

.bank-option {
display: flex;
align-items: center;
gap: 8px;
padding: 8px;
font-size: 0.92rem;
cursor: pointer;
}

.bank-option input {
width: auto;
accent-color: var(--secondary-color);
}

.selection-actions {
display: flex;
gap: 8px;
flex-wrap: wrap;
}

.selection-actions button {
font-size: 0.9rem;
padding: 9px 12px;
width: auto;
flex: 1 1 150px;
}

@media (min-width: 480px) {
.control-panel {
flex-direction: column;
}
}

select, button {
padding: 12px 15px;
font-size: 1rem;
border-radius: 8px;
border: 1px solid #ccc;
outline: none;
width: 100%;
}

select {
background-color: #fff;
appearance: none;
-webkit-appearance: none;
background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB6%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
background-repeat: no-repeat;
background-position: right 12px top 50%;
background-size: 12px auto;
padding-right: 30px;
}

button {
background-color: var(--secondary-color);
color: white;
border: none;
cursor: pointer;
font-weight: 500;
transition: background-color 0.2s, opacity 0.2s, transform 0.2s, box-shadow 0.2s;
touch-action: manipulation;
}

button:hover:not(:disabled) {
transform: translateY(-2px);
box-shadow: 0 7px 14px rgba(6, 47, 84, .14);
}

button:active {
opacity: 0.8;
}

button:disabled {
background-color: #ccc !important;
cursor: not-allowed;
opacity: 0.6;
}

.stats-card {
background: linear-gradient(135deg, #f0f7fb, #e5eef4);
padding: 12px 16px;
border-radius: 8px;
margin-bottom: 16px;
display: flex;
flex-direction: column;
gap: 9px;
font-weight: bold;
font-size: 0.95rem;
border: 1px solid #d5e2eb;
box-shadow: 0 4px 12px rgba(6, 47, 84, .06);
}

.stats-main {
display: flex;
justify-content: space-between;
gap: 12px;
}

.progress-track {
height: 8px;
background: #d4e2ea;
border-radius: 999px;
overflow: hidden;
}

.progress-bar {
height: 100%;
width: 0%;
border-radius: inherit;
background: linear-gradient(90deg, var(--secondary-color), var(--accent-color));
transition: width .5s cubic-bezier(.22, 1, .36, 1);
}

.question-card {
border: 1px solid #dbe5eb;
border-radius: 12px;
padding: 16px;
margin-bottom: 16px;
background-color: #fff;
box-shadow: 0 7px 18px rgba(6, 47, 84, .06);
}

#quizArea > .question-card {
will-change: transform, opacity;
}

.question-enter {
animation: questionEnter .38s cubic-bezier(.22, 1, .36, 1) both;
}

.question-title {
font-size: 1.05rem;
font-weight: bold;
margin-bottom: 16px;
color: #1a1a1a;
line-height: 1.5;
letter-spacing: .01em;
}

.options-container {
display: flex;
flex-direction: column;
gap: 10px;
}

.option-btn {
text-align: left;
background: linear-gradient(135deg, #ffffff, #f5f8fa);
color: #333;
border: 1px solid #ced4da;
padding: 14px 15px;
border-radius: 8px;
cursor: pointer;
font-size: 0.95rem;
line-height: 1.4;
white-space: normal;
word-break: break-word;
transition: transform .2s, box-shadow .2s, border-color .2s, background .2s;
animation: optionEnter .35s ease both;
}

.option-btn:nth-child(2) { animation-delay: .035s; }
.option-btn:nth-child(3) { animation-delay: .07s; }
.option-btn:nth-child(4) { animation-delay: .105s; }
.option-btn:hover:not(:disabled) {
border-color: var(--secondary-color);
background: #eef8fc;
transform: translateX(4px);
box-shadow: 0 5px 12px rgba(10, 101, 156, .12);
}

.option-btn.correct {
background: linear-gradient(135deg, #dff7e9, #c8eedb) !important;
border-color: #c3e6cb !important;
color: #155724 !important;
font-weight: bold;
animation: correctPop .42s cubic-bezier(.22, 1, .36, 1) both;
}

.option-btn.wrong {
background: linear-gradient(135deg, #ffe5e8, #f8d7da) !important;
border-color: #f5c6cb !important;
color: #721c24 !important;
animation: wrongFlash .42s ease both;
}

.result-feedback {
margin-top: 15px;
padding: 12px;
border-radius: 6px;
font-weight: bold;
font-size: 0.95rem;
display: none;
line-height: 1.4;
animation: feedbackEnter .35s ease both;
}

.result-feedback.correct {
background-color: #d4edda;
color: #155724;
}

.result-feedback.wrong {
background-color: #f8d7da;
color: #721c24;
}

.custom-answer-actions {
display: flex;
gap: 8px;
flex-wrap: wrap;
margin-top: 10px;
padding-top: 10px;
border-top: 1px solid rgba(22, 138, 102, .18);
}

.custom-answer-actions button {
width: auto;
flex: 1 1 180px;
padding: 9px 12px;
font-size: .9rem;
}

.custom-answer-actions .remove-answer-btn {
background: #168a66;
}

.custom-answer-actions .keep-answer-btn {
background: #5c7280;
}

/* 錯題庫提示改為不佔版面的隱藏容器，避免管理區下方出現空白紅色區域 */
#customSetNotice,
#customResultNotice {
display: none !important;
}

.result-feedback.correct {
border-left: 4px solid var(--success-color);
}

#resultArea.result-enter {
animation: resultEnter .55s cubic-bezier(.22, 1, .36, 1) both;
}

#celebrationLayer {
position: fixed;
inset: 0;
pointer-events: none;
overflow: hidden;
z-index: 20;
}

.confetti {
position: absolute;
top: -18px;
width: 9px;
height: 15px;
border-radius: 2px;
animation: confettiFall 1.25s cubic-bezier(.2, .7, .3, 1) forwards;
}

#toast {
position: fixed;
left: 50%;
bottom: 24px;
transform: translate(-50%, 18px);
opacity: 0;
z-index: 30;
padding: 10px 16px;
border-radius: 999px;
background: rgba(6, 47, 84, .94);
color: #fff;
font-size: .92rem;
font-weight: 700;
box-shadow: 0 8px 24px rgba(6, 47, 84, .24);
pointer-events: none;
}

#toast.toast-show {
animation: toastInOut 1.55s ease both;
}

.answer-shake {
animation: answerShake .42s ease both;
}

@keyframes pageEnter {
from { opacity: 0; transform: translateY(12px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes questionEnter {
from { opacity: 0; transform: translateY(12px) scale(.985); }
to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes optionEnter {
from { opacity: 0; transform: translateX(-8px); }
to { opacity: 1; transform: translateX(0); }
}

@keyframes correctPop {
0% { transform: scale(.98); }
55% { transform: scale(1.025); }
100% { transform: scale(1); }
}

@keyframes wrongFlash {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-5px); }
75% { transform: translateX(5px); }
}

@keyframes answerShake {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-6px); }
50% { transform: translateX(6px); }
75% { transform: translateX(-3px); }
}

@keyframes feedbackEnter {
from { opacity: 0; transform: translateY(7px); }
to { opacity: 1; transform: translateY(0); }
}

@keyframes resultEnter {
from { opacity: 0; transform: translateY(18px) scale(.98); }
to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes confettiFall {
0% { opacity: 1; transform: translate3d(0, 0, 0) rotate(0deg); }
100% { opacity: 0; transform: translate3d(var(--drift), 92vh, 0) rotate(720deg); }
}

@keyframes toastInOut {
0% { opacity: 0; transform: translate(-50%, 18px); }
15%, 78% { opacity: 1; transform: translate(-50%, 0); }
100% { opacity: 0; transform: translate(-50%, 8px); }
}

@media (prefers-reduced-motion: reduce) {
*, *::before, *::after {
animation-duration: .01ms !important;
animation-iteration-count: 1 !important;
scroll-behavior: auto !important;
transition-duration: .01ms !important;
}
}

.nav-actions {
display: flex;
gap: 10px;
}

.nav-actions button {
flex: 1;
}
</style>
</head>
<body>

<div id="celebrationLayer" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div class="container">
<div class="brand-header">
<h1>海巡法規與勤務線上測驗</h1>
<div class="brand-subtitle">COAST GUARD TRAINING · 法規與勤務學習平台</div>
</div>

<div id="selectionArea">
<div class="control-panel">
<div class="section-label">選擇作答範圍（可選單一章節、複選章節或全部題庫）</div>
<div id="bankPicker" class="bank-picker"></div>
<div class="selection-actions">
<button onclick="selectCategoryBanks('midterm')">全選期中考範圍</button>
<button onclick="selectCategoryBanks('drone')">全選無人機範圍</button>
<button onclick="clearBankSelection()">清除選擇</button>
</div>
<button onclick="shuffleAndReset()">🔀 隨機抽題</button>
<button class="start-btn" onclick="beginSelectedQuiz()">⚓ 開始作答</button>
</div>
</div>

<div id="quizArea" style="display:none;">
<div class="stats-card">
<div class="stats-main">
<span id="progressText">進度：0 / 0</span>
<span id="scoreText">得分：0</span>
</div>
<div class="progress-track" aria-label="答題進度"><div id="progressBar" class="progress-bar"></div></div>
</div>

<div class="question-card">
<div id="questionTitle" class="question-title">題目載入中...</div>
<div id="optionsContainer" class="options-container"></div>
<div id="feedback" class="result-feedback"></div>
</div>

<div class="nav-actions">
<button id="prevBtn" onclick="prevQuestion()" disabled>← 上一題</button>
<button id="nextBtn" onclick="nextQuestion()">下一題 →</button>
</div>
<button id="finishBtn" onclick="finishQuiz()" style="margin-top:10px;">完成測驗並查看結果</button>
</div>
<div id="resultArea" class="question-card" style="display:none;">
<div id="resultTitle" class="question-title"></div>
<div id="resultSummary" class="result-feedback correct" style="display:block;"></div>
<div class="nav-actions">
<button id="retryWrongBtn" onclick="retryWrongQuestions()">錯題再作答一次</button>
<button onclick="returnToQuizSelection()">重新選擇題庫</button>
</div>
</div>
</div>

<script>
const questionBank = {
bank1: {
name: "題庫一：非法出入國",
questions: [
{ id: "b1_1", type: "single", question: "為統籌入出國管理,確保國家安全、保障人權;規範移民事務,落實移民輔導,特制定何法?", options: ["入出國及移民法", "懲治走私條例", "海關緝私條例", "就業服務法"], answer: [0] },
{ id: "b1_2", type: "single", question: "入出國及移民法之主管機關為何?", options: ["海巡署", "國安局", "海關", "內政部"], answer: [3] },
{ id: "b1_3", type: "single", question: "國民有特殊情形,入出國及移民署應禁止其出國,何者為非?", options: ["通緝中", "涉及內亂罪", "冒用護照", "經判處6個月以下有期徒刑宣告緩刑者"], answer: [3] },
{ id: "b1_4", type: "single", question: "關於入出國查驗時之暫時留置,下列敘述何者錯誤?", options: ["暫時留置應於法院為之", "對國民實施暫時留置時間不得逾2小時", "對香港居民實施暫時留置時間不得逾6小時", "暫時留置已無必要時,應立即停止之"], answer: [0] },
{ id: "b1_5", type: "single", question: "下列何者符合申請在臺灣地區定居之資格?", options: ["居住臺灣地區設有戶籍國民在國外出生之女兒,年滿26歲但未婚", "現任僑選立法委員之配偶,婚姻關係滿2年", "有直系血親現在在臺灣地區設有戶籍,本人在臺灣連續居住1年", "經私立大學聘僱,居留滿5年且每年居住200日"], answer: [2] },
{ id: "b1_6", type: "single", question: "有關管制入出境通報對象分類及其處理方式,何者為非?", options: ["限制出境:告知當事人,要求該員遵守不得逾越12浬領海界線之規定。", "限制出海:告知當事人限制出海之文號,限制其搭船出海", "限制出海當事人出示核准出海作業文件,仍不得予以放行", "通緝犯:逮捕移送檢察機關辦理"], answer: [2] },
{ id: "b1_7", type: "single", question: "我國國民在何種情形下,入出國及移民署應禁止其出國,何者為非?", options: ["通緝中", "因案經司法或軍法機關限制出國", "涉及內亂罪、外患罪重大嫌疑", "未繳闖紅燈罰單"], answer: [3] },
{ id: "b1_8", type: "single", question: "臺灣地區無戶籍國民停留期間,有哪些情形者,入出國及移民署得廢止其停留許可,何者為非?", options: ["有事實足認有妨害國家安全或社會安定之虞", "受有期徒刑以上刑之宣告,於刑之執行完畢、假釋、赦免", "受有期徒刑以上刑之宣告緩刑", "護照過期"], answer: [3] },
{ id: "b1_9", type: "single", question: "外國人在何種情形下,入出國及移民署得禁止其入國,何者為非?", options: ["未帶護照或拒不繳驗", "攜帶超額現金", "在我國或外國有犯罪紀錄", "攜帶違禁物"], answer: [1] },
{ id: "b1_10", type: "single", question: "入出國及移民署管理入出國之對象為何,何者為非?", options: ["台灣地區有戶籍國民", "台灣地區無戶籍國民", "外國人", "以上皆是"], answer: [3] },
{ id: "b1_11", type: "single", question: "依據《入出國及移民法》,關於強制驅逐出國處分之執行,下列敘述何者錯誤?", options: ["受強制驅逐出國處分者,於處分執行前,移民署得強制其至指定處所收容。", "對於收容處分,受收容人得向法院提起行政訴訟。", "收容期間,經法官裁定延長者,合計不得逾一百二十日。", "強制驅逐出國之執行,除法律另有規定外,由移民署執行之。"], answer: [2] },
{ id: "b1_12", type: "single", question: "關於臺灣地區無戶籍國民入國之申請,下列何者正確?", options: ["無戶籍國民入國,須事先申請許可,未經許可者不得入國。", "無戶籍國民持有效護照即可免簽證入國,無須經任何審核。", "經許可在臺灣地區定居之無戶籍國民,其戶籍登記義務應於入境後六個月內完成。", "無戶籍國民申請定居之資格,均須在臺灣連續居住滿七年。"], answer: [0] },
{ id: "b1_13", type: "single", question: "針對逾期停居留之罰鍰與管制,下列敘述何者正確?", options: ["逾期停留者,最高得處新臺幣五萬元罰鍰,且應強制出國。", "逾期居留者不論有無特殊狀況,均不得罰鍰,必須強制遣返。", "逾期停居留者之禁止入國期間,均統一為三年。", "移民署對於逾期者之罰鍰,無裁量權,必須處以法定上限。"], answer: [0] },

drone1: { name: "無人機考試｜第一章 民用航空法及相關法規", category: 'drone', questions: [{"id": "drone1_1", "type": "single", "question": "遙控無人機如為不法份子作為犯罪工具或因不當操作而致失控墜落者，可能導致何種後 果？", "options": ["造成他人生命財產之損失。", "危害公共利益。", "影響飛航安全。", "以上皆是。"], "answer": [3]}, {"id": "drone1_2", "type": "single", "question": "市面上遙控無人機類型繁多，為保障操作安全，操作人於購買時應留意產品何項資訊？", "options": ["使用限制。", "操作性能。", "保固範圍。", "以上皆是。"], "answer": [3]}, {"id": "drone1_3", "type": "single", "question": "遙控無人機之註冊、針對操作人員進行教育宣導及操作範圍警示之規定，係為達到哪個 目的？", "options": ["刁難操作人員。", "打擊遙控無人機市場。", "安全使用。", "以上皆是。"], "answer": [2]}, {"id": "drone1_4", "type": "single", "question": "操作證考取目的係為確保操作人於哪個階段能熟悉相關航空知識與管理規範，並具備一 定操作熟練度及緊急處置能力？", "options": ["操作前及操作時。", "操作前及操作後。", "操作前。", "操作後。"], "answer": [0]}, {"id": "drone1_5", "type": "single", "question": "外國人領有外國政府對於所持有遙控無人機之註冊、操作證及檢驗合格等證明文件者， 必須向哪個單位申請認可後，於遵守我國相關法令下從事遙控無人機活動？", "options": ["外交部。", "駐外單位。", "民航局。", "科技部。"], "answer": [2]}, {"id": "drone1_6", "type": "single", "question": "操作人僅透過遙控無人機即時傳輸圖像功能，是否即足以監控鏡頭外之周遭狀況？", "options": ["否。", "是。", "視傳輸圖像清晰度而定。", "視天氣狀況而定。"], "answer": [0]}, {"id": "drone1_7", "type": "single", "question": "操作人不得利用遙控無人機從事哪種行為？", "options": ["合法行為。", "非法行為。", "適法行為。", "法定行為。"], "answer": [1]}, {"id": "drone1_8", "type": "single", "question": "操作人不得無故利用遙控無人機對他人進行何種行為？", "options": ["攝錄非公開活動。", "竊聽私下談話。", "窺視身體隱私部位。", "以上皆是。"], "answer": [3]}, {"id": "drone1_9", "type": "single", "question": "操作人未經同意，不得以遙控無人機對他人進行何種行為？", "options": ["錄音。", "照相、錄影。", "電磁紀錄竊錄。", "以上皆是。"], "answer": [3]}, {"id": "drone1_10", "type": "single", "question": "操作人不得無故利用遙控無人機於哪個場所進行飛航活動？", "options": ["私人庭院。", "學校教室。", "辦公室場所。", "以上皆是。"], "answer": [3]}, {"id": "drone1_11", "type": "single", "question": "遙控無人機於空中進行飛航活動時，易伴隨較高之何種風險？", "options": ["文化風險。", "健康風險。", "社會風險。", "貿易風險。"], "answer": [2]}, {"id": "drone1_12", "type": "single", "question": "對違反規範之遙控無人機操作人及所有人所為之處罰，係欲達到哪個目的？", "options": ["維持社會秩序。", "增進公共利益。", "維護公共安全。", "以上皆是。"], "answer": [3]}, {"id": "drone1_13", "type": "singl "id": "drone1_113", "type": "single", "question": "政府機關（構）、學校或法人依法應保存遙控無人機之註冊號碼、活動日期、活動區域、 飛航時間、飛航性質、操作人員姓名、維護或修理、改裝等紀錄，並應保存多久？", "options": ["1 年。", "2 年。", "3 年。", "5 年。"], "answer": [1]}, {"id": "drone1_114", "type": "single", "question": "有關外國人領有外國政府所核發遙控無人機相關證照者，應向民航局申請認可後使得於 本區從事遙控無人機飛航活動之規定，是否亦適用於領有外國政府核發證照之本國人？", "options": ["是，本國人亦適用。", "否，本國人不適用。", "視活動時間決定適用與否。", "視活動性質決定適用與否。"], "answer": [1]}, {"id": "drone1_115", "type": "single", "question": "某合格無人機業務團隊受委託以遙控無人機執行山區電纜線路查檢工作。惟因路況不 佳，該團隊無法抵達預訂工作區域，為不影響任務進行，成員臨時決定仍將無人機飛至 工作區，並以望遠鏡保持與其間之視線接觸。請問該團隊之決定是否違反無人機相關規 範？", "options": ["並無違反遙控無人機相關規範。", "已違反遙控無人機相關規範。", "有無違反規範視任務執行結果而定。", "資訊不足，無法判斷。"], "answer": [1]}, {"id": "drone1_116", "type": "single", "question": "某無人機團隊獲准於機場跑道上空測試某項酬載功能，有人建議飛得越高越能展現測試 成果，請問操作人對於該建議應有哪項認知？", "options": ["活動既經核准，即無飛航高度限制，想飛多高就多高。", "飛航高度未經核准，仍應遵守距地表面不得逾 400 呎之規定。", "飛航高度聽從現場指揮人員視任務執行狀況決定。", "飛航高度視能見度好壞決定。"], "answer": [1]}, {"id": "drone1_117", "type": "single", "question": "某無人機團隊正擬定拍攝一大型廟會活動之飛航計畫，請問該團隊對於其執行之任務， 應有下列何種正確認知？", "options": ["團隊技術高超，拍攝時無須特別防護工作。", "為達拍攝效果，於任務中任意變換無人機飛航高度甚至接近人群是可以接受的。", "重量較輕的無人機相對危害較小，故可隨意飛近目標物進行拍攝。", "操作人應領有相應專業操作證，且於執行任務前應申請活動許可。"], "answer": [3]}, {"id": "drone1_118", "type": "single", "question": "無人機團隊正在作飛行前準備，臨時被告知因緊急狀況，無人機於飛航時必須裝載由民 航局公告之危險物品，請問操作人該有下列哪項正確認知？", "options": ["僅要能確保無人機飛航時之平衡及控制穩定，即同意該要求，否則拒絕該要求。", "未經核准前，依規定不得以無人機裝載危險物品，應直接拒絕該要求。", "如該危險物品之包裝完好且易固定，即同意該要求，否則就拒絕該要求。", "因為緊急狀況，應無條件同意該要求。"], "answer": [1]}, {"id": "drone1_119", "type": "single", "question": "某款遙控無人機搭載攝影機及 GPS 等裝備，可利用圖傳系統於螢幕上即時傳輸圖像，請 問操作人於操作該款無人機時，對於即時傳輸圖像功能應具有下列哪項正確認知？", "options": ["可完全信賴，操作時不必再監視無人機飛航及其周遭狀況。", "只要搭載攝影裝備解析度夠好，即不必再監視無人機飛航及其周遭狀況。", "只要操作人技術夠純熟，即不必再監視無人機飛航及其周遭狀況。", "無論是否搭載圖傳裝備，操作人仍應隨時監視無人機之飛航及其周遭狀況。"], "answer": [3]}, {"id": "drone1_120", "type": "single", "question": "遙控無人機飛航活動對於其他航空器活動、地面人群及建築物所帶來之影響顯而易見， 請問就操作人而言，應有下列哪項正確觀念？", "options": ["反正其他目標物均很明顯，發現時再緊急避讓即可。", "應於可操作區域進行飛航、遵守相關規定，隨時注意並防止無人機接近任何其他目 標物。", "只要於可操作區域內飛航，無人機是否接近其他目標物非操作者的責任。", "進行無人機飛航活動時，若有目視觀察員在側，由目視觀察員全權負責無人機與其 他目標物之隔離工作。"], "answer": [1]}, {"id": "drone1_121", "type": "single", "question": "某明星正在室外舉行音樂發表會，主辦單位看到現場人山人海，為擴大宣傳效果，臨時 打算請某無人機團隊利用無人機於現場人群上空進行投擲紀念版 T 恤及 CD 活動，請問 下列敘述何者正確？", "options": ["法規已明訂未取得相應專業操作證及事前活動申請許可，不得以遙控無人機進行投 擲作業。", "主辦單位只要事先向現場人群說明活動進行方式，即可進行投擲作業。", "只要主辦單位提供之 T 恤及 CD 數量能符合無人機酬載需求，即可進行投擲作業。", "使用無人機投擲物件稀鬆平常，毫無安全疑慮，可以直接進行投擲作業。"], "answer": [0]}, {"id": "drone1_122", "type": "single", "question": "某電影拍攝作業因取景需求，導演指示團隊將無人機飛入民用航空法所規範之限航區內 執行空拍任務，請問下列敘述何者正確？", "options": ["只要在限航區內不要待太久，趕緊拍攝完畢就好。", "非經核准，限航區內不得從事遙控無人機飛航活動。", "若限航區位處人煙罕至處，飛進去拍攝無妨。", "只要有助手協助觀察限航區內狀況，即可飛入拍攝。"], "answer": [1]}, {"id": "drone1_123", "type": "single", "question": "國內某無人機團隊有名外籍成員，雖領有該國政府所核發之合格無人機操作證，惟尚未 獲得本國民航局認可。針對該名外籍成員欲參與團隊於本國境內之無人機飛航活動之敘 述，下列何者正確？", "options": ["該員已領有外國政府核發證照，理當可於本國境內從事飛航活動。", "如該員已具備無人機操作經歷滿 3 年以上，即可直接於本國境內從事飛航活動。", "該員必須獲得本國民航局認可，使得於本國境內從事飛航活動。", "只要無人機團隊有人願簽切結書擔保活動之安全，該員即可於本國境內從事飛航活 動。"], "answer": [2]}, {"id": "drone1_124", "type": "single", "question": "王大華從某購物商場購買一台最大起飛重量 950 公克的無人多旋翼機，欲作為假日出遊 紀錄小孩玩樂過程的利器，有關王大華應注意事項，下列哪項正確？", "options": ["王大華不須為該台無人多旋翼機辦理註冊。", "王大華須取得高級專業操作證後，才能操作該台無人多旋翼機。", "王大華不得任意於機場周邊進行飛航操作。", "王大華須為該台無人多旋翼機辦理實體檢驗。"], "answer": [2]}, {"id": "drone1_125", "type": "single", "question": "某大學校慶活動，預計於該校室內體育館舉行一場無人機競技比賽，請問有關該比賽之 適法性問題，下列何者為非？", "options": ["該比賽舉辦地點於室內，非屬民航法無人機專章規範範圍。", "該比賽舉辦地點雖於室內，仍屬民航法無人機專章規範範圍。", "操作人於比賽過程中仍須注意在場人員之安全。", "比賽過程中如因操作人操作不當而傷及他人者，操作人仍可能須負相關法律責任。"], "answer": [1]}, {"id": "drone1_126", "type": "single", "question": "某無人機團隊受知名電視台委託，要利用無人機進行即時新聞事件之空拍作業，惟團隊 經評估後認為該空拍作業可能存在安全顧慮，請問該團隊面對電視台之委託，採取下列 何項作法較為恰當？", "options": ["僅須視操作人經驗決定是否接受該任務。", "視電視台給予酬勞多寡決定是否接受該任務。", "評估有安全顧慮即應婉拒該任務，並詳細解釋其原因。", "視任務活動投保額度高低決定是否接受該任務。"], "answer": [2]}, {"id": "drone1_127", "type": "single", "question": "小陳為某新成立無人機業務公司負責人，目前除積極招兵買馬外，亦準備購入 20 台不同 構型、重量之業務用無人機。請問小陳對於該公司所購入無人機之註冊相關規定，下列 敘述何者正確？", "options": ["所有無人機均須辦理註冊。", "最大起飛重量超過 250 公克之無人機才須辦理註冊。", "僅須為所採購無人機之半數辦理註冊即可。", "由主管機關決定應辦理註冊之無人機數量。"], "answer": [0]}, {"id": "drone1_128", "type": "single", "question": "某公司因業務需求所購入之一批無人機剛完成向民航局申請之註冊程序，請問該公司對 於註冊號碼之標註規定所應有認知，下列何者為非？", "options": ["註冊號碼標註位置須能清楚辨識。", "註冊號碼得以噴漆方式標註。", "須確保註冊號碼不會於每次飛航活動中脫落。", "無人機之移動結構外部最適合作為註冊號碼標註之處。"], "answer": [3]}, {"id": "drone1_129", "type": "single", "question": "某無人機團隊因特殊任務需求所新購之一架無人機尚未完成註冊程序，惟因任務在即， 有成員建議先借用另一架已註冊無人機之註冊號碼，再向民航局報備即可。請問針對該 成員之主張，下列何者為正確？", "options": ["註冊號碼本來就可以互相借用，並無違反相關規定。", "只要所借用註冊號碼同屬該團隊其他無人機所有，即無違反相關規定。", "只要先向民航局報備獲准借用，即無違反相關規範。", "註冊號碼不得借供於未註冊之無人機上使用，該成員之主張已明顯違反相關規範。"], "answer": [3]}, {"id": "drone1_130", "type": "single", "question": "無人機團隊因任務需要，為其所有之一架已取得型式檢驗合格證之無人機進行改裝行 為，請問該團隊針對無人機改裝後之應有認知，下列何者正確？", "options": ["改裝者應檢附申請書向民航局再次申請型式檢驗。", "改裝行為並不影響型式檢驗之效力，無須再進行任何檢驗。", "該團隊能擔保改裝行為不影響無人機飛航性能及安全，即不須再進行任何檢驗。", "由主管機關自由判定改裝行為是否須進行重新檢驗。"], "answer": [0]}, {"id": "drone1_131", "type": "single", "question": "某團隊擁有一架最大起飛重量達 30 公斤之無人飛機逾半年之久，經過幾次任務後發現該 機因某項設計缺失而恐致操作安全疑慮，請問該團隊應有下列何項認知及作為？", "options": ["只要加強操作人技術及應付緊急狀況之能力即可，不須採取其他作為。", "團隊應儘速詢求該無人機設計者，以針對設計缺失進行補正作為。", "於往後每次活動區域內設置安全防護網即可，不須採取其他作為。", "於往後活動前只要記得投保較高額度之保險即可，不須採取其他作為。"], "answer": [1]}, {"id": "drone1_132", "type": "single", "question": "某電影公司欲拍攝高速公路警匪追逐場景，為求逼真效果，電影公司要求無人機團隊操 作無人機近距離拍攝疾駛於高速公路上之車輛，請問操作人應有哪項正確認知？", "options": ["這是訓練自己技術的好機會，應大膽接受任務。", "看在電影公司給予高額酬勞的份上，理應接受該任務。", "只要團隊多數人認為可以執行，即應接受該任務。", "未經核准飛航前，無人機飛航活動應遠離高速公路至少 30 公尺以上，該任務顯違反 規定，應予以拒絕。"], "answer": [3]}, {"id": "drone1_133", "type": "single", "question": "某區域發生強烈地震，造成人員傷亡及財產損害嚴重，某新聞機構要求無人機團隊不待 申請，立即趕赴當地執行空拍任務，以便進行獨家即時新聞報導，請問該團隊應有何種 正確認知？", "options": ["緊急情況時，應遵守災害防救法之規定，統一聽從政府災害應變中心指揮及調度， 不可擅自進行拍攝。", "因屬災害危難事件、人命關天，應不顧一切答應其要求，並立即前往進行拍攝。", "只要取得欲拍攝區域之里長口頭同意後，即可進行拍攝任務。", "只要取得欲拍攝區域之消防主管機關口頭同意後，即可進行拍攝任務。"], "answer": [0]}, {"id": "drone1_134", "type": "single", "question": "某大學順應潮流成立無人機社團，其成員亦將成為該校未來無人機業務執行主力。學校 為擴大宣傳，臨時決定某日下午於校園空曠處進行無人機飛航展示活動，請問下列認知 何者正確？", "options": ["校園內飛航無受法規限制，可盡情執行飛航展示活動。", "只要經學校同意，並於活動現場派員口頭宣導注意事項，即可任意進行飛航展示活 動。", "該校仍應於完成飛航活動許可申請後，始得依申請內容進行飛航操作展示。", "為展示無人機性能，刻意將無人機飛越人群、教室或辦公區域是可允許的。"], "answer": [2]}, {"id": "drone1_135", "type": "single", "question": "小華為某公司無人機業務部門主管兼資深飛手，請問有關每趟飛航任務之操作紀錄、無 人機維護紀錄及相關修理紀錄等處置事宜，小華應有哪項正確認知？", "options": ["法規針對相關紀錄之處置並無明確規範，隨公司高層想怎麼處理都可以。", "相關紀錄內容隨便寫寫就好，反正任務完成、機器能正常運作即可。", "明知飛航任務中發生異常現象，為利團隊績效，自行研判若不嚴重，即不須特別紀 錄。", "公司應妥善保存每趟任務之相關紀錄，法規針對紀錄事項及保存期限等亦有相關規 定。"], "answer": [3]}, {"id": "drone1_136", "type": "single", "question": "一架最大起飛重量 5 公斤且裝置導航設備之遙控無人機於海岸邊執行空拍任務時，因操 作不當而致失控墜海，目視機體已明顯損壞無法繼續使用。請問操作人應採取下列哪項 正確作為？", "options": ["只要無造成人員傷亡，即不須作任何處置。", "只要無造成人員傷亡，只需要把墜海的無人機拾回即可。", "無論有無造成人員傷亡，應於事件發生後 24 小時內依規定通報當地消防單位。", "無論有無造成人員傷亡，應於事件發生後 24 小時內依規定通報民航局。"], "answer": [3]}, {"id": "drone1_137", "type": "single", "question": "某無人機團隊正規劃一場沙灘音樂饗宴任務，其內容包括：「日落後利用無人機於參與民 眾上空噴灑彩色粉末，以製造繽紛效果」。請問下列何者為該團隊執行任務前最重要之考 量因素？", "options": ["操作者之飛航技術及膽識是否足夠。", "彩色粉末之數量是否足夠活動需求。", "該任務是否已經申請核准，操作者是否領有相應操作證。", "現場燈光及音效設備是否良好，以營造絢麗歡樂效果。"], "answer": [2]}, {"id": "drone1_138", "type": "single", "question": "某公司無人機團隊正執行飛航任務，突接獲上層電話指示須臨時將無人機飛至前方人群 密集之住宅區拍攝所需影像，並表示公司先前已獲得民航局相關安全能力審查通過，可 放心飛入執行拍攝。」請問該團隊應有下列何種正確認知？", "options": ["當然是聽從上層的要求，直接飛入住宅區進行拍攝。", "活動前仍應依規定向民航局申請執行許可後，使得進行拍攝。", "只要臨時通知所在地轄區派出所後，即可進行拍攝。", "只要臨時通知所在地轄區里長辦公室後，即可進行拍攝。"], "answer": [1]}, {"id": "drone1_139", "type": "single", "question": "某業餘玩家利用假日至一處未被劃設禁飛區域內進行無人機試飛活動，並預劃完成數項 操作科目，此時已接近日落，尚有幾個科目未完成，請問有關下列該玩家應注意事項， 何者正確？", "options": ["該區域非為禁飛區，故該玩家於日落後仍可持續進行科目操作。", "該玩家於日落前即應終止其飛航科目操作。", "如果天氣良好即可於日落後持續進行飛航科目操作。", "只要觀察四周無人，即可於日落後持續進行飛航科目操作。"], "answer": [1]}, {"id": "drone1_140", "type": "single", "question": "假設現有以下資訊： 1.日落時間為本地時間 18 點 46 分。 2.民用暮光時間為 19 點 12 分。 3.航海暮光時間為 19 點 43 分。 4.天文暮光時間為 20 點 16 分。 請問無人機操作 人應於何時終止飛航活動？", "options": ["18 點 46 分。", "19 點 12 分。", "19 點 43 分。", "20 點 16 分。"], "answer": [0]}, {"id": "drone1_141", "type": "single", "question": "無人機團隊正評估釣客欲於近海海域使用無人機至離岸數公里處進行投放釣餌之操作需 求，請問下列哪項說明為該團隊最重要之考量因素？", "options": ["無人機裝載釣餌前後之重量與重心變化是否於其操作限制內。", "無人機之動力來源是否足以支撐該項投擲任務之完成。", "涉及利用無人機投擲物體之限制操作項目，應申請活動許可並應考取相關操作證。", "釣客是否投保相關保險並願意簽署任務執行切結書。"], "answer": [2]}, {"id": "drone1_142", "type": "single", "question": "某雜誌社委託無人機團隊利用無人機執行一項具有相當危險性之飛航任務，負責人並保 證：「於執行任務過程中若發生任何事件，導致人員死傷或財物毀損，均由雜誌社全權負 責，請團隊安心進行任務。」請問有關該負責人之保證，下列敘述何者正確？", "options": ["雜誌社要能提供書面保證及繳交足額保證金，使得作為團隊免責之依據。", "只要不是故意造成人員死傷或財物毀損，任一方均不須負賠償責任。", "只要活動經申請核准執行，且已作有必要防護措施者，任一方均不須負賠償責任。", "操作無人機造成人員死傷或財物毀損，不論故意或過失，應由所有人及操作人負連 帶賠償責任。"], "answer": [3]}, {"id": "drone1_143", "type": "single", "question": "無人機團隊自行設計並組裝一架無人機，以因應越趨多元之任務型態，因某次任務時程 緊迫，團隊雖然知道該無人機尚未通過檢驗核可，仍決議先進行任務使用，等任務結束 後再趕緊完成檢驗程序。請問有關該團隊之決議，下列敘述何整正確？", "options": ["只要於任務前先以口頭知會民航局，並於任務後儘快送檢即可。", "只要於任務後以口頭知會民航局，並儘快送檢即可。", "未經向民航局申請檢驗取得檢驗合格證者，不得從事飛航活動。", "於任務前先以口頭知會民航局，並由民航局決定是否准予先執行任務，後續再完成 檢驗程序。"], "answer": [2]}, {"id": "drone1_144", "type": "single", "question": "某無人機團隊所有之一架無人機，於一次任務中因動力失效而墜落地面，機身經檢視受 損嚴重，並經評估恐難以再修復使用。請問團隊針對該無人機應有之後續處置作為，下 列敘述何者正確?", "options": ["該無人機既已損毀，直接丟棄即可，惟應保留其註冊號碼及檢驗合格證。", "再購買一架新無人機，並得直接使用原損壞無人機之註冊號碼，惟不能使用其檢驗 合格證。", "再購買一架新無人機，並得直接使用原損壞無人機之檢驗合格證，惟不能使用其註 冊號碼。", "所有人應於事實發生日起 15 日內向民航局申請註銷註冊。其註冊號碼及檢驗合格證 均不得使用於其他無人機。"], "answer": [3]}, {"id": "drone1_145", "type": "single", "question": "某無人機團隊已獲得民航局安全能力審查核可，得於人群聚集處進行空拍任務。於某次 任務執行前，團隊依規定向民航局申請活動許可，惟對於是否應向當地地方政府申請一 事意見相左，請問下列敘述何者正確？", "options": ["法律為民航局訂定的，當然只要向民航局申請即可。", "一般而言，經民航局核准後，地方政府通常不會有意見，故不須再做申請。", "除獲民航局許可外，仍應取得地方政府之同意，故還是得做申請。", "是否要向地方政府申請，依執行任務之危險度或複雜度而定。"], "answer": [2]}, {"id": "drone1_146", "type": "single", "question": "有關操作人從事遙控無人機飛航活動時應注意之距離限制，下列何者為正確？", "options": ["應至少距高速公路範圍 10 公尺以上。", "應至少距高架鐵路範圍 20 公尺以上。", "應至少距建築物及障礙物範圍 30 公尺以上。", "以上均正確。"], "answer": [2]}] },

及風速：機場風向風速之觀測值，使用觀測下列哪個期間之 平均風向與平均風速之編報？", "options": ["前 1 分鐘。", "前 10 分鐘。", "前 60 分鐘。", "前 180 分鐘。"], "answer": [1]}, {"id": "drone3_118", "type": "single", "question": "航空例行天氣報告中，雲量是指下列哪個定義？", "options": ["雲在天空中的烏黑程度。", "雲在天空中的高度。", "雲在天空中遮蓋的份數。", "雲在天空中的移動速度。"], "answer": [2]}, {"id": "drone3_119", "type": "single", "question": "遙控無人機操作人針對不同壓力高度對於無人機起降滑行距離之影響，應有何種正確認 知？", "options": ["只要載重固定，起降滑行距離不受壓力高度變化影響。", "起降滑行距離與跑道鋪面、坡度及地面風向有關，無關壓力高度。", "壓力高度影響空氣密度，進而影響爬升率，對於起降滑行距離有直接影響。", "起降滑行距離與無人機動力來源有關，無關壓力高度。"], "answer": [2]}, {"id": "drone3_120", "type": "single", "question": "「霧」對於無人機起降活動之影響顯而易見，請問下列針對「霧」的成因判斷，何者最 為恰當？", "options": ["注意風（空氣水平運動）的狀況，風速增加就可能形成「霧」。", "注意對流（空氣垂直運動）的狀況，對流增強就可能形成「霧」。", "注意大氣壓力值是否降低，降低就可能形成「霧」。", "注意空氣溫度是否接近露點溫度，接近就可能形成「霧」。"], "answer": [3]}, {"id": "drone3_121", "type": "single", "question": "無人機結束任務正準備返場，團隊藉由氣象資料得知 5 邊航線上有風切現象，風速及風 向變化劇烈，請問操作人應特別注意風切對無人機之何項影響？", "options": ["引擎轉數可能因此而不穩定。", "資料鏈和 GPS 可能因此而失效。", "重心可能因此而偏移。", "可能造成升力損失，影響飛航穩定性，甚至無法安全降落。"], "answer": [3]}, {"id": "drone3_122", "type": "single", "question": "無人機正於高聳建物附近飛行，因地面上障礙物會影響風的流動，故操作人應特別注意 下列何種情形？", "options": ["風速及風向快速變化所產生之亂流。", "加強無人機穩定性及視線。", "發揮無人機性能表現。", "避免資料鏈和 GPS 可能因風速及風向之變化而失效。"], "answer": [0]}, {"id": "drone3_123", "type": "single", "question": "當氣團行經水面和陸地，最終將與另一不同特性的氣團接觸。此兩種不同類型的氣團的 邊界層稱為鋒面。請問操作人最容易辨認下列哪一種鋒面中的不連續現象？", "options": ["雲層的增加。", "相對濕度的增加。", "溫度的變化。", "能見度的變化。"], "answer": [2]}, {"id": "drone3_124", "type": "single", "question": "當無人機須穿越鋒面進行飛航任務時，操作人應特別注意下列哪一種天氣現象之變化？", "options": ["降水型態之改變。", "風向之改變。", "氣團穩定性之改變。", "相對濕度之改變。"], "answer": [1]}, {"id": "drone3_125", "type": "single", "question": "無人機正以定速（40 kts/時）及定姿態方式保持往東飛行，此時 GPS 速度（地速）顯示 為 44 kts/時，GPS 航向為 116 度，請問風速和風向約略為何？", "options": ["東風 20 kts。", "北風 20 kts。", "南風 20 kts。", "西風 20 kts。"], "answer": [1]}, {"id": "drone3_126", "type": "single", "question": "當無人機飛行於標準大氣壓力之環境下，其高度表指示高度（壓力高度）為 3,000 英 呎，請問此時大氣壓力約為多少？", "options": ["28.86 英吋汞柱高。", "27.82 英吋汞柱高。", "26.82 英吋汞柱高。", "25.84 英吋  "answer": [1]}, {"id": "drone4_51", "type": "single", "question": "遙控無人機操作人在飛航操作環境下，以系統性的評估風險及處理壓力的方法，來達成 最適宜的結果，稱之為何種方法？", "options": ["腦力激盪。", "人因工程。", "飛行決策。", "以上皆是。"], "answer": [2]}, {"id": "drone4_52", "type": "single", "question": "某種狀況、物體或活動，其可能造成人員傷亡、裝備損壞或降低運作效能，稱之為下列 哪種狀況？", "options": ["風險。", "危害。", "災難。", "事故。"], "answer": [1]}, {"id": "drone4_53", "type": "single", "question": "危害所可能造成的後果，稱之為下列哪種狀況？", "options": ["風險。", "災難。", "意外。", "事故。"], "answer": [0]}, {"id": "drone4_54", "type": "single", "question": "在有限的時間壓力下，未經充分蒐集、分析利弊、僅憑直覺或經驗即執行的過程稱為下 列哪種方式？", "options": ["工程決斷。", "反射抉擇。", "自動決策。", "兩難情境。"], "answer": [2]}, {"id": "drone4_55", "type": "single", "question": "無人機正在執行任務時，發現天氣明顯變化：能見度變差、相對濕度變高、陣風風速變 大，請問操作人應採取下列哪一項動作？", "options": ["當機立斷，立即將無人機返場降落，以免危及無人機性能和飛行安全。", "視無人機團隊組員人數而定，如果人數夠多就繼續執行任務，不用擔心天氣影響到 無人機性能和飛行安全。", "視無人機機型而定，如果無人機出廠性能優異就繼續執行任務，不必在乎天氣影響 到無人機性能和飛行安全。", "以上皆是。"], "answer": [0]}, {"id": "drone4_56", "type": "single", "question": "在作飛行規劃或操作無人機時，操作人手上有多項性能資料，每項都言之成理，但又不 盡相同，甚至互相矛盾，操作人應優先使用下列哪一項？", "options": ["航空教科書計算得出的性能資料。", "之前操作人提供的經驗及建議。", "無人機製造商提供的性能資料。", "類似系統提供的預估性能資料。"], "answer": [2]}, {"id": "drone4_57", "type": "single", "question": "請問在下列哪一種情況下，操作人可以不必執行無人機起飛前檢查？", "options": ["前一次飛行已作過起飛前檢查，如果緊接著執行下一次飛行，就不必執行起飛前檢 查。", "當天第一次飛行已作過起飛前檢查，之後當天的所有飛行就都不必執行起飛前檢 查。", "每次飛行前都必須執行起飛前檢查，沒有任何情況可以免除。", "視飛行任務而定，如果任務簡單且飛行時間短，操作人判斷起飛前檢查屬多餘，就 不必執行起飛前檢查。"], "answer": [2]}, {"id": "drone4_58", "type": "single", "question": "下午 3 點無人機飛行時天氣愈來愈壞，氣象預報說下午有雷雨，但此時無人機正在執行 一項任務，至少需要到下午 5 點才能結束返場，請問操作人應採取下列哪一項飛行決 策？", "options": ["在惡劣天氣下飛行，會增加飛航安全的風險，應避免在雷雨期間下執行任務。", "無人機狀況良好，雖然氣象預報說有雷雨，但不一定會發生，就算發生也不一定會 碰上，所以可繼續執行任務。", "以前也不是沒碰過雷雨，只要無人機狀況良好、操作人能力優秀，克服天氣因素沒 問題，所以可繼續執行任務。", "因為此次任務非常重要，中途放棄會損失許多金錢和時間，所以可繼續執行任務， 等碰到雷雨再說。"], "answer": [0]}, {"id": "drone4_59", "type": "single", "question": "無人機已連續飛行一段長時間，操作人全程專心操作，但因前一夜休息不足略顯疲態， 操作團隊其他組員感覺該操作人反應變慢、注意力渙散、專注力下降、協調性及溝通性 降低等，請問操作團隊應採取下列哪一項動作？", "options": ["因為該操作人比較熟悉任務需求，還是由他繼續操作，其他組員多跟他講話，鼓舞 精神，硬撐下去。", "詢問該操作人會不會疲累、可否繼續操作；如果不會疲累就繼續操作，如果會疲累 再說。", "基於飛航安全的考量，應儘快返場落地；由其他合適的操作人繼續執行任務。", "請該操作人將無人機至於自主飛行模式，然後閉目養神，直到精神恢復再繼續操 作。"], "answer": [2]}, {"id": "drone4_60", "type": "single", "question": "無人機準備下午 3 點以後執行任務，為了避免視線干擾應慎選控制站方位，請問操作人 應選擇下列哪一種操作方位？", "options": ["操作方位面向西方。", "操作方位面向東方。", "任一種操作方位都可以，不必擔心視線干擾。", "操作方位應面對操作範圍內任何反光物體。"], "answer": [1]}, {"id": "drone4_61", "type": "single", "question": "無人機正在飛行時，操作團隊臨時要求操作人執行原先飛行計畫沒有安排的科目，請問 操作人應如何處理？", "options": ["對原先飛行計畫沒有安排的科目，應一律拒絕執行。", "既然是操作團隊要求的科目，就應配合執行。", "依科目重要性而定，重要的話就不顧一切去執行，不重要的話就不執行。", "快速評估可行性，包括無人機性能、個人能力及其他限制等，再決定是否執行。"], "answer": [3]}, {"id": "drone4_62", "type": "single", "question": "無人機計畫執行視距內任務，操作人預估有一段路徑無法保持目視無人機，請問操作人 應如何處置？", "options": ["使用望遠鏡來執行該段路徑無人機飛航。", "只要操作人技術夠好，就不必在意該段路徑。", "只要知道該段路徑沒有障礙、沒有其他無人機，就可以繼續執行任務。", "改變飛行路徑，以保持目視無人機。"], "answer": [3]}, {"id": "drone4_63", "type": "single", "question": "最大起飛重量二公斤以上且裝置導航裝置之遙控無人機於執行任務途中，因天氣變壞、 能見度變差，最後導致無人機失控墜毀於空曠無人區域，未造成人員死傷或財物毀損， 請問操作人對該無人機墜毀事件應有下列哪一項認知？", "options": ["雖然未造成人員死傷或財物毀損，仍應將無人機殘骸撿拾乾淨再回程，而且不要跟 任何單位通報，以免造成自己困擾。", "應在墜毀現場檢討失事原因，檢視殘骸狀況，勿破壞現場，通報當地警察局處理。", "無人機因天氣等不可抗力因素而失控墜毀，只要未造成人員死傷或財物毀損，就不 必做任何善後處理或通報任何單位。", "事件發生後，無人機所有人或操作人應將事件經過通報民航局。"], "answer": [3]}, {"id": "drone4_64", "type": "single", "question": "無人機團隊正在作任務前簡報，有人聞到操作人身上有明顯的酒味，便提出質疑，操作 人表示他剛剛只是喝了一小杯高粱酒，應無大礙，請問無人機團隊對該操作人的說法應 有下列哪一項認知？", "options": ["法令規定有其容忍值，但基於飛航安全的考量，在未經酒測前，應禁止操作人執行 飛航活動。", "應以任務執行為優先，還是讓該操作人從事飛航活動，只要無人機團隊多加留意便 是。", "適當的飲酒不但無害且有助視力及反應，所以不必當回事，仍依原計畫讓該操作人 從事飛航活動。", "依該操作人的現場狀況而定，如果該操作人看起來還好就讓他從事飛航活動，如果 該操作人看起來醉醺醺就禁止他從事飛航活動。"], "answer": [0]}, {"id": "drone4_65", "type": "single", "question": "無人機結束當天任務準備返場，又接到任務指示：「立即至另一指定地點執行下一項任 務。」請問操作人對該任務指示應有下列哪一項認知？", "options": ["既然尚未返場落地，就接受該任務指示，以滿足任務需求為優先考量。", "既然當天任務已經結束，就不必理會該任務指示，趕緊返場，早點收工休息。", "考量下一項任務的油量需求、人員負荷、空域、天氣及無人機狀況等，如果都沒有 安全顧慮，不會對任何人或物造成危險，就接受該任務指示，否則應拒絕該任務指 示，先返場整備後再執行下一項任務。", "應依下一項任務的重要性而定，如果下一項任務很重要，就接受該任務指示，否則 就拒絕該任務指示。"], "answer": [2]}, {"id": "drone4_66", "type": "single", "question": "無人機在地面檢整，準備從事飛航活動，無人機團隊有人主張：「目視檢查無人機外觀完 整，應該就沒問題，符合安全飛航條件，可以從事飛航活動。」請問操作人對該主張應 有下列哪一項認知？", "options": ["該主張正確，只要外觀完整，就可以從事飛航活動。", "該主張不正確，除了外觀完整，安全飛航條件還包含：機構及動力系統穩固、飛航 註冊號碼依規定標示可辨、遙控設備與無人機間之通信及控制鏈路運作正常、燃油 或電力之供應符合飛航之需求等。", "如果提出該主張的人經驗豐富，見多識廣，代表該主張正確，否則該主張不正確。", "應依當時現場的天候狀況而定，如果天候狀況適於從事飛航活動，代表該主張正 確，否則該主張不正確。"], "answer": [1]}, {"id": "drone4_67", "type": "single", "question": "無人機團隊正在作任務前簡報，氣象預報指出在任務飛行路徑無人機將進入雷雨區，無 人機很可能碰到強勁的上升氣流及下降氣流，請問操作人對該氣象預報應有下列哪一項 認知？", "options": ["無人機在雷雨區飛行是很稀鬆平常的事，不必放在心上。", "無人機先起飛再說，說不定雷雨區沒有氣象預報說的強勁氣流，或者根本沒有雷雨 區。", "應依當時任務的重要性而定，如果任務重要就繼續從事飛航活動，否則就取消。", "因為操作區域氣象條件惡劣，應審慎評估從事飛航活動的風險，必要時應建議無人 機團隊延期執行任務。"], "answer": [3]}, {"id": "drone4_68", "type": "single", "question": "無人機因操作人操作不當導致失控墜毀於外海，通報民航局備查後，操作人情緒激動， 久久不能平復，要求無人機團隊立即讓他操作另一架同型無人機來完成沒有作完的任 務，請問無人機團隊對該要求應有下列哪一項認知？", "options": ["操作人情緒不穩定，宜暫停從事無人機之飛航活動，所以應拒絕該要求。", "「操作不當」的不良紀錄會導致操作人聲譽受損，讓操作人繼續執行無人機任務有 助他扳回面子，所以應同意該要求。", "應視當時的天氣狀況而定，如果天氣好就同意該要求，否則就拒絕該要求。", "應視另一架同型無人機的機務狀況而定，如果機務狀況好就同意該要求，否則就拒 絕該要求。"], "answer": [0]}, {"id": "drone4_69", "type": "single", "question": "無人機團隊在作任務前簡報，針對此次任務可能的緊急狀況及其處置，團隊中有人主張 到時碰到再看事辦事，隨機應變即可，不用管什麼程序，請問操作人對該主張應有下列 哪一項認知？", "options": ["無人機操作人的經驗最重要，只要操作人自認有把握，就可以同意該主張。", "應依無人機團隊的共識而定，如果有共識就同意該主張，否則就不同意該主張。", "應依無人機任務的重要性而定，如果任務重要就同意該主張，否則就不同意該主 張。", "操作人應完全熟悉並遵守無人機飛行手冊/操作人操作手冊所規定的程序作緊急處 置，不可以同意該主張。"], "answer": [3]}, {"id": "drone4_70", "type": "single", "question": "操作人正在作無人機飛行前檢查，發現螺槳上有刮傷刻痕，請問操作人對該刻痕應有下 列哪一項認知？", "options": ["螺槳上有刮傷刻痕很平常，知道就好，不必大驚小怪。", "螺槳上有刮傷刻痕極為危險，應立即更換螺槳才可以啟動引擎。", "先執行無人機任務要緊，任務完成後再由無人機團隊共同研商該刻痕之對策。", "操作人應針對該刻痕依據廠商手冊或相關資料作風險評估，判斷該刻痕所產生風險 的嚴重性及可能性是否可以接受。"], "answer": [3]}, {"id": "drone4_71", "type": "single", "question": "無人機正在機場的南方空域飛行時，航管通知有飛機準備從 06 跑道進場，要求無人機必 須避開進場航線，請問操作人應採取下列哪一項動作？", "options": ["避開目前飛行空域的西方和北方。", "避開目前飛行空域的東方和北方。", "避開目前飛行空域的西方和南方。", "避開目前飛行空域的東方和南方。"], "answer": [0]}, {"id": "drone4_72", "type": "single", "question": "無人機在溫暖天氣低空飛行時常會有對流的氣流造成上下起伏的亂流空氣，請問操作人 應採取下列哪一項動作來避免這些亂流情形？", "options": ["維持穩定速度飛行；視情況爬升高度 const questionCategories = {
  midterm: { name: "期中考範圍｜海巡法規與勤務", keys: Object.keys(questionBank).filter(key => key.startsWith("bank")) },
  drone: { name: "無人機考試｜遙控無人機專業操作證", keys: Object.keys(questionBank).filter(key => key.startsWith("drone")) }
};

let selectedBankKeys = new Set(["bank1"]);
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let userAnswers = {};
let wrongQuestions = [];
let quizMode = "normal";
function beginSelectedQuiz() {
startSelectedBanks();
if (!currentQuestions.length) {
showToast("請至少選擇一個題庫，再開始作答。");
return;
}
document.getElementById("selectionArea").style.display = "none";
document.getElementById("quizArea").style.display = "block";
window.scrollTo({ top: 0, behavior: "smooth" });
}

// 初始化題庫選擇器
function initSelect() {
const picker = document.getElementById("bankPicker");
if (!picker) return;
picker.innerHTML = "";
for (const categoryKey of Object.keys(questionCategories)) {
  const category = questionCategories[categoryKey];
  const group = document.createElement("div");
  group.className = "bank-category";
  const header = document.createElement("div");
  header.className = "bank-category-header";
  const title = document.createElement("strong");
  title.textContent = category.name;
  const categoryBtn = document.createElement("button");
  categoryBtn.type = "button";
  categoryBtn.className = "category-select-btn";
  categoryBtn.textContent = "選取此類別";
  categoryBtn.onclick = () => selectCategoryBanks(categoryKey);
  header.append(title, categoryBtn);
  group.appendChild(header);
  const options = document.createElement("div");
  options.className = "bank-category-options";
  for (const key of category.keys) {
    const label = document.createElement("label");
    label.className = "bank-option";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = key;
    checkbox.checked = selectedBankKeys.has(key);
    checkbox.onchange = updateSelectedBanks;
    label.appendChild(checkbox);
    label.appendChild(document.createTextNode(questionBank[key].name));
    options.appendChild(label);
  }
  group.appendChild(options);
  picker.appendChild(group);
}
startSelectedBanks();
}

function updateSelectedBanks() {
const checked = [...document.querySelectorAll("#bankPicker input:checked")];
const checkedCategories = Object.keys(questionCategories).filter(categoryKey =>
  checked.some(input => questionCategories[categoryKey].keys.includes(input.value))
);
if (checkedCategories.length > 1) {
  const activeCategory = checkedCategories[checkedCategories.length - 1];
  const allowed = new Set(questionCategories[activeCategory].keys);
  document.querySelectorAll("#bankPicker input").forEach(input => {
    input.checked = allowed.has(input.value) && input.checked;
  });
}
selectedBankKeys = new Set([...document.querySelectorAll("#bankPicker input:checked")].map(input => input.value));
}

function selectCategoryBanks(categoryKey) {
const category = questionCategories[categoryKey];
if (!category) return;
const categoryKeys = new Set(category.keys);
// 期中考與無人機考試範圍互斥，選取一類時自動取消另一類。
document.querySelectorAll("#bankPicker input").forEach(input => {
  input.checked = categoryKeys.has(input.value);
});
selectedBankKeys = new Set(category.keys);
startSelectedBanks();
}

function clearBankSelection() {
document.querySelectorAll("#bankPicker input").forEach(input => input.checked = false);
selectedBankKeys.clear();
currentQuestions = [];
currentIndex = 0;
score = 0;
userAnswers = {};
renderQuestion();
}

// 載入所選的一個或多個題庫
function startSelectedBanks() {
updateSelectedBanks();
const keys = [...selectedBankKeys];
currentQuestions = keys.flatMap(key => questionBank[key] ? questionBank[key].questions : []);
currentIndex = 0;
score = 0;
userAnswers = {};
quizMode = "normal";
document.getElementById("quizArea").style.display = "none";
document.getElementById("resultArea").style.display = "none";
renderQuestion();
}

// 隨機抽題並重置
function shuffleAndReset() {
startSelectedBanks();
if (!currentQuestions.length) return;
currentQuestions.sort(() => Math.random() - 0.5);
document.getElementById("selectionArea").style.display = "none";
document.getElementById("quizArea").style.display = "block";
renderQuestion();
}

let toastTimer;

function showToast(message) {
const toast = document.getElementById("toast");
if (!toast) return;
toast.textContent = message;
toast.className = "";
void toast.offsetWidth;
toast.className = "toast-show";
clearTimeout(toastTimer);
toastTimer = setTimeout(() => { toast.className = ""; }, 1700);
}

function celebrateCorrect() {
const layer = document.getElementById("celebrationLayer");
if (!layer) return;
const colors = ["#d5a928", "#0a659c", "#168a66", "#e56b6f", "#062f54"];
layer.innerHTML = "";
for (let i = 0; i < 26; i++) {
const piece = document.createElement("span");
piece.className = "confetti";
piece.style.left = `${Math.random() * 100}%`;
piece.style.backgroundColor = colors[i % colors.length];
piece.style.setProperty("--drift", `${Math.round((Math.random() - 0.5) * 180)}px`);
piece.style.animationDelay = `${Math.random() * 0.18}s`;
layer.appendChild(piece);
}
setTimeout(() => { layer.innerHTML = ""; }, 1600);
}

// 渲染當前題目
function renderQuestion() {
if (!currentQuestions || currentQuestions.length === 0) {
document.getElementById("questionTitle").textContent = "此題庫暫無題目。";
document.getElementById("optionsContainer").innerHTML = "";
document.getElementById("progressText").textContent = "進度：0 / 0";
document.getElementById("scoreText").textContent = "得分：0";
const emptyProgress = document.getElementById("progressBar");
if (emptyProgress) emptyProgress.style.width = "0%";
return;
}

const q = currentQuestions[currentIndex];
document.getElementById("progressText").textContent = `進度：${currentIndex + 1} / ${currentQuestions.length}`;
document.getElementById("scoreText").textContent = `得分：${score}`;
const progressBar = document.getElementById("progressBar");
if (progressBar) progressBar.style.width = `${((currentIndex + 1) / currentQuestions.length) * 100}%`;
const questionPanel = document.querySelector("#quizArea > .question-card");
if (questionPanel) {
questionPanel.classList.remove("question-enter");
void questionPanel.offsetWidth;
questionPanel.classList.add("question-enter");
}
document.getElementById("questionTitle").textContent = `${currentIndex + 1}. ${q.question}${q.type === "multiple" ? "（複選）" : ""}`;

const optionsContainer = document.getElementById("optionsContainer");
optionsContainer.innerHTML = "";

const feedback = document.getElementById("feedback");
feedback.style.display = "none";
feedback.className = "result-feedback";

const hasAnswered = Object.prototype.hasOwnProperty.call(userAnswers, currentIndex);

q.options.forEach((opt, idx) => {
const btn = document.createElement("button");
btn.className = "option-btn";
btn.textContent = `${String.fromCharCode(65 + idx)}. ${opt}`;

if (hasAnswered) {
btn.disabled = true;
const selectedIdx = userAnswers[currentIndex];
const correctIdx = q.answer[0];

if (idx === correctIdx) {
btn.classList.add("correct");
}
if (idx === selectedIdx && selectedIdx !== correctIdx) {
btn.classList.add("wrong");
}
} else {
btn.onclick = () => checkAnswer(idx);
}

optionsContainer.appendChild(btn);
});

if (hasAnswered) {
const selectedIdx = userAnswers[currentIndex];
const correctIdx = q.answer[0];
if (selectedIdx === correctIdx) {
if (quizMode === "custom") {
feedback.style.display = "block";
feedback.classList.add("correct");
const actions = document.createElement("div");
actions.className = "custom-answer-actions";
const removeBtn = document.createElement("button");
removeBtn.className = "remove-answer-btn";
removeBtn.type = "button";
removeBtn.textContent = "✓ 已學會，從錯題庫刪除";
removeBtn.onclick = () => window.removeCurrentCustomQuestion();
const keepBtn = document.createElement("button");
keepBtn.className = "keep-answer-btn";
keepBtn.type = "button";
keepBtn.textContent = "保留本題，之後繼續複習";
keepBtn.onclick = () => window.keepCurrentCustomQuestion();
actions.append(removeBtn, keepBtn);
feedback.appendChild(actions);
} else {
feedback.style.display = "none";
}
} else {
feedback.style.display = "block";
feedback.textContent = `答錯了！正確答案是：(${String.fromCharCode(65 + correctIdx)}) ${q.options[correctIdx]}`;
feedback.classList.add("wrong");
}
}

document.getElementById("prevBtn").disabled = currentIndex === 0;
document.getElementById("nextBtn").disabled = currentIndex === currentQuestions.length - 1;
}

// 檢查答案
function checkAnswer(selectedIdx) {
if (Object.prototype.hasOwnProperty.call(userAnswers, currentIndex)) return;

userAnswers[currentIndex] = selectedIdx;
const q = currentQuestions[currentIndex];
const correctIdx = q.answer[0];

if (selectedIdx === correctIdx) {
score += 5; // 每題 5 分
}

renderQuestion();
const questionPanel = document.querySelector("#quizArea > .question-card");
if (selectedIdx === correctIdx) {
celebrateCorrect();
if (navigator.vibrate) navigator.vibrate(55);
} else {
if (questionPanel) {
questionPanel.classList.remove("answer-shake");
void questionPanel.offsetWidth;
questionPanel.classList.add("answer-shake");
}
if (navigator.vibrate) navigator.vibrate([60, 35, 60]);
}
}

// 完成測驗並整理錯題
function finishQuiz() {
if (!currentQuestions.length) {
showToast("請至少選擇一個題庫。");
return;
}
if (Object.keys(userAnswers).length < currentQuestions.length) {
showToast("還有題目尚未作答，請先完成所有題目。");
return;
}
wrongQuestions = currentQuestions.filter((q, index) => userAnswers[index] !== q.answer[0]);
const total = currentQuestions.length * 5;
document.getElementById("resultTitle").textContent = quizMode === "wrong" ? "錯題重做完成" : (quizMode === "custom" ? "我的錯題庫練習完成" : "測驗完成");
document.getElementById("resultSummary").textContent = `本次答對 ${currentQuestions.length - wrongQuestions.length} / ${currentQuestions.length} 題，得分：${score} / ${total}。`;
document.getElementById("retryWrongBtn").style.display = wrongQuestions.length ? "block" : "none";
document.getElementById("quizArea").style.display = "none";
document.getElementById("resultArea").style.display = "block";
const resultArea = document.getElementById("resultArea");
resultArea.classList.remove("result-enter");
void resultArea.offsetWidth;
resultArea.classList.add("result-enter");
if (!wrongQuestions.length) {
celebrateCorrect();
}
window.scrollTo({ top: 0, behavior: "smooth" });
}

function retryWrongQuestions() {
if (!wrongQuestions.length) return;
currentQuestions = [...wrongQuestions];
currentIndex = 0;
score = 0;
userAnswers = {};
quizMode = "wrong";
document.getElementById("resultArea").style.display = "none";
document.getElementById("quizArea").style.display = "block";
renderQuestion();
}

function returnToQuizSelection() {
document.getElementById("selectionArea").style.display = "block";
startSelectedBanks();
}

// 切換題目
function prevQuestion() {
if (currentIndex > 0) {
currentIndex--;
renderQuestion();
window.scrollTo({ top: 0, behavior: 'smooth' });
}
}

function nextQuestion() {
if (currentIndex < currentQuestions.length - 1) {
currentIndex++;
renderQuestion();
window.scrollTo({ top: 0, behavior: 'smooth' });
}
}

// 使用相容性更好的 DOMContentLoaded 事件
if (document.readyState === "loading") {
document.addEventListener("DOMContentLoaded", initSelect);
} else {
initSelect();
}
</script>


<script>
(function () {
  var storageKey = 'coastGuardCustomMistakeSets';
  var customSets = readSets();
  var selectedSetId = '';

  function readSets() {
    try { return JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch (e) { return []; }
  }
  function saveSets() {
    localStorage.setItem(storageKey, JSON.stringify(customSets));
    renderControls();
  }
  function getSet() { return customSets.find(function (set) { return set.id === selectedSetId; }); }
  function questionById(id) {
    for (var key in questionBank) {
      var found = questionBank[key].questions.find(function (question) { return question.id === id; });
      if (found) return found;
    }
    return null;
  }
  function setOptions() {
    var html = '<option value="">選擇自己的錯題庫</option>';
    customSets.forEach(function (set) {
      html += '<option value="' + set.id + '"' + (set.id === selectedSetId ? ' selected' : '') + '>' + set.name + '（' + set.questionIds.length + ' 題）</option>';
    });
    return html;
  }
  function renderControls() {
    var selectHtml = customSets.length ? '<select id="customSetSelect" onchange="window.selectCustomMistakeSet(this.value)">' + setOptions() + '</select><button onclick="window.practiceCustomMistakeSet()">練習此錯題庫</button><button style="background:#8b2635" onclick="window.deleteCustomMistakeSet()">刪除錯題庫</button>' : '<span style="color:#64748b">尚未建立錯題庫</span>';
    var panel = document.getElementById('customMistakePanel');
    if (panel) panel.querySelector('.custom-controls').innerHTML = selectHtml;
    var result = document.getElementById('customResultControls');
    if (result) result.innerHTML = customSets.length ? '<select id="customResultSetSelect" onchange="window.selectCustomMistakeSet(this.value)">' + setOptions() + '</select><button onclick="window.addWrongToCustomSet()">加入錯題庫</button>' : '<span style="color:#64748b">請先建立錯題庫</span>';
  }
  function createSet(inputId, noticeId) {
    var input = document.getElementById(inputId);
    var name = (input.value || '').trim();
    if (!name) { document.getElementById(noticeId).textContent = '請先輸入錯題庫名稱。'; return; }
    var set = { id: 'custom_' + Date.now(), name: name, questionIds: [] };
    customSets.push(set); selectedSetId = set.id; input.value = ''; saveSets();
    document.getElementById(noticeId).textContent = '已建立「' + name + '」錯題庫。';
  }
  window.selectCustomMistakeSet = function (id) { selectedSetId = id; renderControls(); };
  window.keepCurrentCustomQuestion = function () {
    var actions = document.querySelector('.custom-answer-actions');
    if (actions) {
      actions.innerHTML = '<span style="color:#168a66;font-weight:700">已保留本題，之後仍可繼續複習。</span>';
    }
    if (typeof showToast === 'function') showToast('已保留本題');
  };
  window.removeCurrentCustomQuestion = function () {
    if (typeof quizMode === 'undefined' || quizMode !== 'custom') return;
    var question = currentQuestions[currentIndex];
    var set = getSet();
    if (!question || !set) return;
    set.questionIds = set.questionIds.filter(function (id) { return id !== question.id; });
    saveSets();
    var oldAnswers = userAnswers;
    var nextAnswers = {};
    Object.keys(oldAnswers).forEach(function (key) {
      var index = Number(key);
      if (index < currentIndex) nextAnswers[index] = oldAnswers[key];
      if (index > currentIndex) nextAnswers[index - 1] = oldAnswers[key];
    });
    userAnswers = nextAnswers;
    score = Math.max(0, score - 5);
    currentQuestions.splice(currentIndex, 1);
    if (typeof showToast === 'function') showToast('已從錯題庫移除，做得很好！');
    if (!currentQuestions.length) {
      document.getElementById('quizArea').style.display = 'none';
      document.getElementById('selectionArea').style.display = 'block';
      renderControls();
      return;
    }
    if (currentIndex >= currentQuestions.length) currentIndex = currentQuestions.length - 1;
    renderQuestion();
  };
  window.createCustomMistakeSet = function () { createSet('customSetName', 'customSetNotice'); };
  window.createCustomSetFromResult = function () { createSet('customResultSetName', 'customResultNotice'); };
  window.deleteCustomMistakeSet = function () {
    var set = getSet(); if (!set) return;
    if (!confirm('確定刪除「' + set.name + '」嗎？')) return;
    customSets = customSets.filter(function (item) { return item.id !== set.id; }); selectedSetId = ''; saveSets();
  };
  window.addWrongToCustomSet = function () {
    var select = document.getElementById('customResultSetSelect'); if (select) selectedSetId = select.value;
    var set = getSet();
    if (!set) { document.getElementById('customResultNotice').textContent = '請先選擇要收錄的錯題庫。'; return; }
    var ids = new Set(set.questionIds);
    wrongQuestions.forEach(function (question) { ids.add(question.id); });
    set.questionIds = Array.from(ids); saveSets();
    document.getElementById('customResultNotice').textContent = '已將 ' + wrongQuestions.length + ' 題加入「' + set.name + '」。';
  };
  window.practiceCustomMistakeSet = function () {
    var set = getSet();
    if (!set) { document.getElementById('customSetNotice').textContent = '請先選擇自己的錯題庫。'; return; }
    var qs = set.questionIds.map(questionById).filter(Boolean);
    if (!qs.length) { document.getElementById('customSetNotice').textContent = '這個錯題庫目前沒有題目。'; return; }
    currentQuestions = qs; currentIndex = 0; score = 0; userAnswers = {}; quizMode = 'custom';
    document.getElementById('selectionArea').style.display = 'none'; document.getElementById('resultArea').style.display = 'none'; document.getElementById('quizArea').style.display = 'block'; renderQuestion();
  };
  function addPanels() {
    var selection = document.getElementById('selectionArea');
    if (selection && !document.getElementById('customMistakePanel')) {
      var panel = document.createElement('div'); panel.id = 'customMistakePanel'; panel.className = 'question-card'; panel.style.marginTop = '18px';
      panel.innerHTML = '<div class="question-title">我的錯題庫（所有人共用，可新增或刪除題目）</div><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="customSetName" placeholder="例如：海巡勤務錯題" style="flex:1;min-width:210px;padding:11px;border:1px solid #ccd5dc;border-radius:8px"><button onclick="window.createCustomMistakeSet()">＋新增錯題庫</button></div><div class="custom-controls" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"></div><div id="customSetNotice" class="result-feedback wrong" style="display:block;min-height:0"></div>';
      selection.appendChild(panel);
    }
    var result = document.getElementById('resultArea');
    if (result && !document.getElementById('customResultPanel')) {
      var box = document.createElement('div'); box.id = 'customResultPanel'; box.className = 'question-card'; box.style.marginTop = '14px';
      box.innerHTML = '<div class="question-title">將本次錯題加入自己的錯題庫</div><div id="customResultControls" style="display:flex;gap:8px;flex-wrap:wrap"></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><input id="customResultSetName" placeholder="輸入新錯題庫名稱" style="flex:1;min-width:210px;padding:11px;border:1px solid #ccd5dc;border-radius:8px"><button onclick="window.createCustomSetFromResult()">新增錯題庫</button></div><div id="customResultNotice" class="result-feedback correct" style="display:block;min-height:0"></div>';
      result.insertBefore(box, result.firstChild);
    }
    renderControls();
  }
  var oldFinish = window.finishQuiz;
  window.finishQuiz = function () { oldFinish(); addPanels(); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addPanels); else addPanels();
})();
</script>
</body>
</html>
